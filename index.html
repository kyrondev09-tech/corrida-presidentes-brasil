      /**
       * Reconstrói o estádio "Esporte É Vida / Juntos Pelo Brasil / Mais Esporte, Mais Futuro"
       * em Pixel Art caso a imagem local não possa ser carregada no sandbox.
       */
      static createFallbackStadiumCanvas() {
        const w = 960;
        const h = 540;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // 1. Céu Azul Vibrante e Nuvens Pixeladas
        ctx.fillStyle = '#1d72e8';
        ctx.fillRect(0, 0, w, 130);
        ctx.fillStyle = '#5da9ff';
        ctx.fillRect(0, 45, w, 85);
        ctx.fillStyle = '#d8ecff';
        for (let x = 40; x < w; x += 150) {
          ctx.fillRect(x, 28, 75, 22);
          ctx.fillRect(x + 15, 18, 45, 14);
        }

        // Torre de iluminação à esquerda e Bandeira do Brasil à direita
        ctx.fillStyle = '#334155';
        ctx.fillRect(36, 8, 12, 105);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(22, 6, 42, 38);
        ctx.fillStyle = '#f8fafc';
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 4; c++) {
            ctx.fillRect(26 + c * 9, 10 + r * 11, 6, 7);
          }
        }

        // Bandeira do Brasil no topo direito e Placar Eletrônico
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(822, 24, 44, 28);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(832, 30, 24, 16);
        ctx.fillStyle = '#1d4ed8';
        ctx.fillRect(839, 34, 10, 8);

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(855, 54, 105, 76);
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 4;
        ctx.strokeRect(857, 56, 101, 72);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(878, 72, 16, 36);
        ctx.fillRect(908, 74, 38, 5);
        ctx.fillRect(908, 88, 38, 5);
        ctx.fillRect(908, 102, 38, 5);

        // 2. Cobertura da Arquibancada
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(0, 66, 835, 14);
        ctx.fillStyle = '#475569';
        ctx.fillRect(0, 80, 825, 22);

        // 3. Arquibancada Lotada (Torcida Pixelada Colorida)
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 102, w, 108);
        const crowdColors = ['#facc15', '#16a34a', '#2563eb', '#ef4444', '#ffffff', '#f97316'];
        for (let y = 106; y < 208; y += 6) {
          for (let x = 0; x < w; x += 6) {
            if ((x > 442 && x < 466) || (x > 145 && x < 162)) {
              ctx.fillStyle = '#94a3b8'; // Escadarias
            } else {
              ctx.fillStyle = crowdColors[(x * 7 + y * 13) % crowdColors.length];
            }
            ctx.fillRect(x, y, 5, 5);
          }
        }

        // 4. Faixas Patrióticas e Esportivas do Estádio
        const banners = [
          { x: 0, w: 255, bg: '#0255b8', text: 'ESPORTE É VIDA', color: '#ffffff' },
          { x: 260, w: 315, bg: '#127332', text: 'JUNTOS PELO BRASIL', color: '#facc15' },
          { x: 660, w: 300, bg: '#b81422', text: 'MAIS ESPORTE, MAIS FUTURO', color: '#ffffff' }
        ];
        ctx.fillStyle = '#1d4ed8';
        ctx.fillRect(0, 210, w, 34);
        banners.forEach((b) => {
          ctx.fillStyle = b.bg;
          ctx.fillRect(b.x, 212, b.w, 28);
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 2;
          ctx.strokeRect(b.x, 212, b.w, 28);
          ctx.fillStyle = b.color;
          ctx.font = 'bold 13px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.text, b.x + b.w / 2, 227);
        });

        // Gramado interno e arbustos acima da pista
        ctx.fillStyle = '#388e3c';
        ctx.fillRect(0, 244, w, 26);
        ctx.fillStyle = '#1b5e20';
        for (let x = 90; x < w; x += 180) {
          ctx.fillRect(x, 250, 75, 16);
        }

        // 5. Pista de Atletismo Terracota (5 Raias Horizontais + Gramado Inferior)
        const trackTop = 270;
        const trackBottom = 492;
        ctx.fillStyle = '#c8432b';
        ctx.fillRect(0, trackTop, w, trackBottom - trackTop);

        // Textura granulada sutil de pixel art na pista
        ctx.fillStyle = '#b53821';
        for (let y = trackTop; y < trackBottom; y += 8) {
          for (let x = (y % 16); x < w; x += 16) {
            ctx.fillRect(x, y, 4, 4);
          }
        }

        // Linhas horizontais brancas das 5 raias
        const laneY = [276, 294, 320, 354, 396, 442, 490];
        ctx.fillStyle = '#f8fafc';
        laneY.forEach((ly) => {
          ctx.fillRect(0, ly, w, 3);
        });

        // Linha diagonal branca de largada e números 1 a 5 à esquerda
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(310, 276);
        ctx.lineTo(42, 490);
        ctx.stroke();

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 20px "Press Start 2P", monospace';
        const nums = [
          { n: '1', x: 286, y: 308 },
          { n: '2', x: 256, y: 338 },
          { n: '3', x: 222, y: 376 },
          { n: '4', x: 182, y: 420 },
          { n: '5', x: 135, y: 468 }
        ];
        nums.forEach((item) => {
          ctx.fillText(item.n, item.x, item.y);
        });

        // Gramado inferior na base da tela
        ctx.fillStyle = '#2e7d32';
        ctx.fillRect(0, trackBottom, w, h - trackBottom);
        ctx.fillStyle = '#1b5e20';
        for (let x = 0; x < w; x += 12) {
          ctx.fillRect(x, trackBottom + (x % 24 === 0 ? 4 : 10), 6, 8);
        }

        return canvas;
      }
    }

    /* ==========================================================================
       3. CLASSE DO CORREDOR (FÍSICA, ANIMAÇÃO E HABILIDADES)
       ========================================================================== */
    class Runner {
      constructor(config) {
        this.id = config.id;
        this.name = config.name;
        this.primaryColor = config.primaryColor;
        this.secondaryColor = config.secondaryColor;
        this.tagBg = config.tagBg;
        this.tagBorder = config.tagBorder;
        this.tagText = config.tagText;
        this.laneYRatio = config.laneYRatio; // Posição vertical dos pés na pista (0..1 da altura da imagem)
        this.scaleFactor = config.scaleFactor || 1.0;

        this.spriteData = null;

        this.reset();
      }

      reset() {
        this.distance = 0; // Distância percorrida em metros
        this.baseSpeed = 9.5; // Velocidade normal base (m/s)
        this.currentSpeed = this.baseSpeed;
        this.naturalSeed = this.id === 'lula' ? 0.8 : 3.7;

        // Estado do Impulso Normal
        this.boostTimer = 0;
        this.boostDuration = 3.0;
        this.boostCooldown = 0;
        this.boostCooldownMax = 1.6;

        // Estado do Super Impulso
        this.superTimer = 0;
        this.superDuration = 4.6;

        // Animação
        this.animPhase = this.id === 'lula' ? 0 : Math.PI;
        this.stepAccumulator = 0;
        this.screenX = 0;
        this.screenY = 0;
        this.rank = this.id === 'lula' ? 1 : 2;
        this.afterimages = [];
      }

      activateNormalBoost() {
        if (this.boostTimer > 0 || this.boostCooldown > 0) return false;
        this.boostTimer = this.boostDuration;
        return true;
      }

      activateSuperBoost() {
        this.superTimer = this.superDuration;
        // Cancela ou sobrepõe impulso menor
        if (this.boostTimer < 1.0) this.boostTimer = 1.0;
        return true;
      }

      update(dt, elapsedTime, onStepCallback) {
        // 1. Oscilação natural sutil para que a corrida seja dinâmica mesmo sem cliques
        const wave1 = Math.sin(elapsedTime * 1.45 + this.naturalSeed) * 0.42;
        const wave2 = Math.cos(elapsedTime * 2.6 + this.naturalSeed * 1.7) * 0.25;
        let targetSpeed = this.baseSpeed + wave1 + wave2;

        // 2. Efeito do Impulso Normal (aceleração rápida e decaimento gradual)
        if (this.boostTimer > 0) {
          this.boostTimer = Math.max(0, this.boostTimer - dt);
          const norm = this.boostTimer / this.boostDuration; // 1 -> 0
          // Curva suave que sobe rápido e desacelera gradualmente no fim
          const boostPower = Math.sin(Math.pow(norm, 0.65) * (Math.PI / 2));
          targetSpeed += 6.2 * boostPower;

          if (this.boostTimer === 0) {
            this.boostCooldown = this.boostCooldownMax;
          }
        } else if (this.boostCooldown > 0) {
          this.boostCooldown = Math.max(0, this.boostCooldown - dt);
        }

        // 3. Efeito do Super Impulso (muito mais forte e duradouro)
        if (this.superTimer > 0) {
          this.superTimer = Math.max(0, this.superTimer - dt);
          const norm = this.superTimer / this.superDuration;
          const superPower = Math.sin(Math.pow(norm, 0.55) * (Math.PI / 2));
          targetSpeed += 13.5 * superPower;
        }

        // Limite máximo seguro de velocidade para nunca quebrar a física
        targetSpeed = Math.min(27.5, Math.max(7.5, targetSpeed));

        // Interpolação suave da velocidade atual (sem teletransportes bruscos)
        const accelRate = targetSpeed > this.currentSpeed ? 7.5 : 4.2;
        this.currentSpeed += (targetSpeed - this.currentSpeed) * Math.min(1, dt * accelRate);

        // Atualiza distância percorrida
        this.distance += this.currentSpeed * dt;

        // Atualiza fase da animação dos braços e pernas proporcionalmente à velocidade
        const cycleSpeed = this.currentSpeed * 1.38;
        this.animPhase = (this.animPhase + cycleSpeed * dt) % (Math.PI * 2);

        // Dispara poeira/som a cada passada no chão
        this.stepAccumulator += cycleSpeed * dt;
        if (this.stepAccumulator >= Math.PI) {
          this.stepAccumulator -= Math.PI;
          if (onStepCallback) onStepCallback(this);
        }

        // Rastro (Afterimages) durante impulsos
        if (this.isBoosted()) {
          if (Math.random() < (this.superTimer > 0 ? 0.65 : 0.35)) {
            this.afterimages.push({
              x: this.screenX,
              y: this.screenY,
              frameIdx: this.getCurrentFrameIndex(),
              alpha: this.superTimer > 0 ? 0.55 : 0.35,
              isSuper: this.superTimer > 0
            });
          }
        }

        for (let i = this.afterimages.length - 1; i >= 0; i--) {
          const ghost = this.afterimages[i];
          ghost.x -= this.currentSpeed * 18 * dt;
          ghost.alpha -= dt * 1.9;
          if (ghost.alpha <= 0) {
            this.afterimages.splice(i, 1);
          }
        }
      }

      isBoosted() {
        return this.boostTimer > 0 || this.superTimer > 0;
      }

      getCurrentFrameIndex() {
        if (!this.spriteData) return 0;
        const total = this.spriteData.frames.list.length;
        return Math.floor((this.animPhase / (Math.PI * 2)) * total) % total;
      }
    }

    /* ==========================================================================
       4. GERENCIADOR DE EFEITOS VISUAIS RETRÔ (PARTÍCULAS, LINHAS E BANNERS)
       ========================================================================== */
    class EffectsManager {
      constructor() {
        this.particles = [];
        this.speedLines = [];
        this.banners = [];
        this.fireworks = [];
      }

      reset() {
        this.particles = [];
        this.speedLines = [];
        this.banners = [];
        this.fireworks = [];
      }

      spawnDust(x, y, color = '#f1dca7', count = 5) {
        for (let i = 0; i < count; i++) {
          this.particles.push({
            x: x - 8 + (Math.random() - 0.5) * 14,
            y: y - 2 + (Math.random() - 0.5) * 6,
            vx: -60 - Math.random() * 90,
            vy: -18 - Math.random() * 45,
            size: 3 + Math.floor(Math.random() * 4),
            color,
            alpha: 0.9,
            life: 0.35 + Math.random() * 0.25,
            maxLife: 0.6
          });
        }
      }

      spawnBoostBurst(x, y, isSuper, primaryColor) {
        const count = isSuper ? 28 : 14;
        const palette = isSuper
          ? ['#ffbe0b', '#fb5607', '#ffffff', '#ff006e', primaryColor]
          : [primaryColor, '#ffdf00', '#ffffff'];

        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = (isSuper ? 90 : 50) + Math.random() * (isSuper ? 180 : 110);
          this.particles.push({
            x,
            y: y - 40 + (Math.random() - 0.5) * 40,
            vx: Math.cos(angle) * speed - 60,
            vy: Math.sin(angle) * speed,
            size: 4 + Math.floor(Math.random() * 5),
            color: palette[i % palette.length],
            alpha: 1,
            life: 0.45 + Math.random() * 0.35,
            maxLife: 0.8
          });
        }
      }

      /**
       * Dispara uma EXPLOSÃO GIGANTE DE FOGOS DE ARTIFÍCIO que toma quase toda a tela (60% a 90%),
       * em ondas sucessivas épicas de estilo arcade com rastros luminosos, faíscas e partículas cintilantes.
       */
      spawnFireworks(baseX, baseY, theme = 'lula', screenW = 1200, screenH = 700) {
        // Paletas temáticas com alto brilho e transições de cor exuberantes
        const palette = theme === 'lula'
          ? [
              '#ff002b', '#e60026', '#ff2a55', '#ff4d6d', '#ff758f',
              '#ff5400', '#ff8500', '#ffbe0b', '#ffd166', '#ffffff'
            ]
          : [
              '#00e676', '#00c853', '#10b981', '#059669', '#34d399',
              '#6ee7b7', '#a7f3d0', '#ffdf00', '#ffe169', '#ffffff'
            ];

        const accentColor = theme === 'lula' ? '#ff3344' : '#00e676';

        // 14 a 16 centros de explosões gigantes cobrindo o topo, laterais, centro e profundidade da tela
        const bursts = [
          // Onda 1: Impacto Imediato nos arredores do corredor líder e no alto (0.00s a 0.20s)
          { xPct: baseX / screenW, yPct: Math.max(0.20, (baseY - 140) / screenH), delay: 0.00, count: 58, speedMult: 1.35, sizeBoost: 2 },
          { xPct: 0.22, yPct: 0.28, delay: 0.08, count: 48, speedMult: 1.25, sizeBoost: 1 },
          { xPct: 0.78, yPct: 0.25, delay: 0.16, count: 52, speedMult: 1.30, sizeBoost: 1 },

          // Onda 2: Explosões gigantescas no topo e no céu do estádio (0.35s a 0.75s)
          { xPct: 0.50, yPct: 0.16, delay: 0.35, count: 65, speedMult: 1.50, sizeBoost: 3 },
          { xPct: 0.35, yPct: 0.22, delay: 0.50, count: 50, speedMult: 1.30, sizeBoost: 2 },
          { xPct: 0.65, yPct: 0.20, delay: 0.65, count: 54, speedMult: 1.35, sizeBoost: 2 },

          // Onda 3: Expansão periférica massiva para as laterais e centro-baixo (0.85s a 1.30s)
          { xPct: 0.12, yPct: 0.38, delay: 0.85, count: 46, speedMult: 1.20, sizeBoost: 1 },
          { xPct: 0.88, yPct: 0.34, delay: 1.00, count: 48, speedMult: 1.25, sizeBoost: 1 },
          { xPct: 0.44, yPct: 0.32, delay: 1.15, count: 55, speedMult: 1.30, sizeBoost: 2 },

          // Onda 4: Apoteose final em grande sequência aérea (1.45s a 2.10s)
          { xPct: 0.28, yPct: 0.15, delay: 1.45, count: 52, speedMult: 1.40, sizeBoost: 2 },
          { xPct: 0.72, yPct: 0.17, delay: 1.65, count: 54, speedMult: 1.45, sizeBoost: 2 },
          { xPct: 0.50, yPct: 0.24, delay: 1.90, count: 70, speedMult: 1.60, sizeBoost: 3 },
          { xPct: 0.82, yPct: 0.42, delay: 2.10, count: 42, speedMult: 1.15, sizeBoost: 1 }
        ];

        bursts.forEach((b) => {
          const cx = b.xPct * screenW;
          const cy = b.yPct * screenH;
          const count = b.count;

          // Anel principal de choque e faíscas da explosão
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.28;
            const baseSpeed = (120 + Math.random() * 260) * b.speedMult;
            const color = palette[Math.floor(Math.random() * palette.length)];
            const maxLife = 1.35 + Math.random() * 1.30; // Garante efeito completo durando até 3.5 segundos

            this.fireworks.push({
              x: cx,
              y: cy,
              prevX: cx,
              prevY: cy,
              vx: Math.cos(angle) * baseSpeed,
              vy: Math.sin(angle) * baseSpeed,
              gravity: 52 + Math.random() * 32,
              drag: 0.962,
              size: (3 + Math.floor(Math.random() * 4)) + b.sizeBoost,
              color,
              alpha: 0.95,
              life: maxLife,
              maxLife,
              delay: b.delay,
              sparkle: Math.random() < 0.65,
              hasTrail: true
            });
          }

          // Flash central de luminosidade da detonação
          this.fireworks.push({
            x: cx,
            y: cy,
            prevX: cx,
            prevY: cy,
            vx: 0,
            vy: 0,
            gravity: 0,
            drag: 1,
            size: 26 + b.sizeBoost * 10,
            color: '#ffffff',
            alpha: 0.9,
            life: 0.14,
            maxLife: 0.14,
            delay: b.delay,
            sparkle: false,
            isFlash: true
          });
        });
      }

      /**
       * Dispara um pequeno show de fogos de artifício temático e leve durante a reprodução dos memes.
       * Varia tamanho, formato, quantidade de partículas e local das explosões.
       * Lula: Predominantemente vermelhos (com toques dourados e brancos).
       * Bolsonaro: Predominantemente verdes (com toques amarelos e brancos).
       */
      spawnMemeFirework(theme = 'lula', screenW = 1200, screenH = 700) {
        const palette = theme === 'lula'
          ? ['#ff002b', '#ff3355', '#e60026', '#ff5400', '#ffdf00', '#ffffff', '#ffd166']
          : ['#00e676', '#00c853', '#10b981', '#34d399', '#ffdf00', '#ffffff', '#ffe169'];

        // Local aleatório no terço superior/médio da tela (estádio e céu)
        const cx = screenW * (0.08 + Math.random() * 0.84);
        const cy = screenH * (0.08 + Math.random() * 0.40);

        // Variação de tamanho, velocidade e quantidade de partículas (12 a 22)
        const count = 12 + Math.floor(Math.random() * 11);
        const baseSpeed = 70 + Math.random() * 115;
        const sizeBoost = Math.random() < 0.3 ? 1 : 0;
        const blastLife = 0.65 + Math.random() * 0.55;

        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
          const speed = baseSpeed * (0.65 + Math.random() * 0.70);
          const color = palette[Math.floor(Math.random() * palette.length)];
          const maxLife = blastLife * (0.75 + Math.random() * 0.5);

          this.fireworks.push({
            x: cx,
            y: cy,
            prevX: cx,
            prevY: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 36 + Math.random() * 24,
            drag: 0.966,
            size: (2 + Math.floor(Math.random() * 3)) + sizeBoost,
            color,
            alpha: 0.95,
            life: maxLife,
            maxLife,
            delay: 0,
            sparkle: Math.random() < 0.5,
            hasTrail: true
          });
        }

        // Flash central discreto de ignição
        this.fireworks.push({
          x: cx,
          y: cy,
          prevX: cx,
          prevY: cy,
          vx: 0,
          vy: 0,
          gravity: 0,
          drag: 1,
          size: 14 + sizeBoost * 6,
          color: '#ffffff',
          alpha: 0.8,
          life: 0.09,
          maxLife: 0.09,
          delay: 0,
          sparkle: false,
          isFlash: true
        });
      }

      spawnBanner(text, subtext, bgColor, borderColor) {
        // Evita acumular muitos banners iguais
        if (this.banners.length > 1) this.banners.shift();
        this.banners.push({
          text,
          subtext,
          bgColor,
          borderColor,
          timer: 1.55,
          maxTimer: 1.55
        });
      }

      update(dt, canvasW, canvasH, boostIntensity) {
        // Atualiza partículas de poeira e impulso
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 90 * dt; // Gravidade leve
          p.life -= dt;
          p.alpha = Math.max(0, p.life / p.maxLife);
          if (p.life <= 0) {
            this.particles.splice(i, 1);
          }
        }

        // Atualiza partículas de fogos de artifício gigantes com rastro e balística
        for (let i = this.fireworks.length - 1; i >= 0; i--) {
          const fw = this.fireworks[i];
          if (fw.delay > 0) {
            fw.delay -= dt;
            continue;
          }

          fw.prevX = fw.x;
          fw.prevY = fw.y;

          fw.x += fw.vx * dt;
          fw.y += fw.vy * dt;
          fw.vx *= fw.drag;
          fw.vy = fw.vy * fw.drag + fw.gravity * dt;
          fw.life -= dt;
          fw.alpha = Math.max(0, fw.life / fw.maxLife);

          if (fw.life <= 0) {
            this.fireworks.splice(i, 1);
          }
        }

        // Gera linhas de velocidade horizontais quando há impulso ativo
        if (boostIntensity > 0 && Math.random() < boostIntensity * 0.75) {
          this.speedLines.push({
            x: canvasW + 20,
            y: canvasH * (0.46 + Math.random() * 0.46),
            length: 45 + Math.random() * 95 * boostIntensity,
            speed: (900 + Math.random() * 650) * (0.8 + boostIntensity * 0.5),
            thickness: boostIntensity > 1 ? 3 : 2,
            color: boostIntensity > 1 ? '#ffbe0b' : '#ffffff',
            alpha: 0.45 + Math.random() * 0.35
          });
        }

        for (let i = this.speedLines.length - 1; i >= 0; i--) {
          const l = this.speedLines[i];
          l.x -= l.speed * dt;
          if (l.x + l.length < 0) {
            this.speedLines.splice(i, 1);
          }
        }

        // Atualiza banners temporários
        for (let i = this.banners.length - 1; i >= 0; i--) {
          this.banners[i].timer -= dt;
          if (this.banners[i].timer <= 0) {
            this.banners.splice(i, 1);
          }
        }
      }

      drawBehindRunners(ctx) {
        // Desenha linhas de velocidade na pista
        for (const l of this.speedLines) {
          ctx.save();
          ctx.globalAlpha = l.alpha;
          ctx.fillStyle = l.color;
          ctx.fillRect(Math.round(l.x), Math.round(l.y), Math.round(l.length), l.thickness);
          ctx.restore();
        }
      }

      drawFront(ctx, canvasW, canvasH) {
        // Desenha partículas de poeira e impulso em pixel art (quadrados nítidos)
        for (const p of this.particles) {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
          ctx.fillStyle = '#000000';
          ctx.strokeRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
          ctx.restore();
        }

        // Desenha partículas de fogos de artifício gigantes com rastros luminosos e cintilação
        for (const fw of this.fireworks) {
          if (fw.delay > 0) continue;
          ctx.save();

          if (fw.isFlash) {
            // Flash circular translúcido do estouro do fogo
            ctx.globalAlpha = Math.max(0, fw.alpha * 0.55);
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(Math.round(fw.x), Math.round(fw.y), fw.size * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            continue;
          }

          const flicker = fw.sparkle ? (0.68 + Math.random() * 0.32) : 1;
          const currentAlpha = Math.max(0, Math.min(0.92, fw.alpha * flicker));
          ctx.globalAlpha = currentAlpha;

          // Rastro luminoso retrô acompanhando a trajetória da partícula
          if (fw.hasTrail) {
            ctx.save();
            ctx.strokeStyle = fw.color;
            ctx.lineWidth = Math.max(2, fw.size - 1);
            ctx.lineCap = 'square';
            ctx.globalAlpha = currentAlpha * 0.50;
            ctx.beginPath();
            ctx.moveTo(Math.round(fw.prevX), Math.round(fw.prevY));
            ctx.lineTo(Math.round(fw.x), Math.round(fw.y));
            ctx.stroke();
            ctx.restore();
          }

          // Núcleo brilhante da partícula de fogo em pixel art
          ctx.fillStyle = fw.color;
          const fx = Math.round(fw.x - fw.size * 0.5);
          const fy = Math.round(fw.y - fw.size * 0.5);
          ctx.fillRect(fx, fy, fw.size, fw.size);

          // Contorno pixelado para manter nitidez retrô sem borrar os corredores
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.lineWidth = 1;
          ctx.strokeRect(fx, fy, fw.size, fw.size);

          ctx.restore();
        }

        // Desenha Banners Arcade ("IMPULSO!", "SUPER IMPULSO!", "ULTRAPASSAGEM!")
        this.banners.forEach((b, idx) => {
          const progress = 1 - (b.timer / b.maxTimer);
          let scale = 1;
          if (progress < 0.15) {
            scale = 0.5 + (progress / 0.15) * 0.6;
          } else if (progress < 0.25) {
            scale = 1.1 - ((progress - 0.15) / 0.10) * 0.1;
          }
          const alpha = b.timer < 0.3 ? b.timer / 0.3 : 1;

          const centerX = canvasW * 0.5;
          const centerY = Math.max(92, canvasH * 0.20) + idx * 54;

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(centerX, centerY);
          ctx.scale(scale, scale);

          const isSmallMobile = canvasW < 380;
          const isMobile = canvasW < 520;
          const fontSize = isSmallMobile ? 10 : (isMobile ? 12 : 17);
          ctx.font = `bold ${fontSize}px "Press Start 2P", monospace`;
          const textW = ctx.measureText(b.text).width;
          const boxW = Math.min(canvasW - 24, Math.max(textW + (isSmallMobile ? 20 : 36), isSmallMobile ? 160 : 200));
          const boxH = b.subtext ? (isSmallMobile ? 38 : 46) : (isSmallMobile ? 28 : 34);

          // Sombra pixelada
          ctx.fillStyle = '#000000';
          ctx.fillRect(-boxW / 2 + 3, -boxH / 2 + 3, boxW, boxH);

          // Fundo do Banner
          ctx.fillStyle = b.bgColor;
          ctx.fillRect(-boxW / 2, -boxH / 2, boxW, boxH);

          // Borda Dupla Arcade
          ctx.lineWidth = 3;
          ctx.strokeStyle = b.borderColor;
          ctx.strokeRect(-boxW / 2, -boxH / 2, boxW, boxH);

          // Texto Principal
          ctx.fillStyle = '#000000';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.text, 2, b.subtext ? -4 : 2);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(b.text, 0, b.subtext ? -6 : 0);

          // Subtexto
          if (b.subtext) {
            ctx.font = `bold ${isMobile ? 8 : 10}px "Press Start 2P", monospace`;
            ctx.fillStyle = '#ffdf00';
            ctx.fillText(b.subtext, 0, 12);
          }

          ctx.restore();
        });
      }
    }

    /* ==========================================================================
       5. SISTEMA CENTRALIZADO DE MEMES (ÁUDIOS, FRASES DINÂMICAS E FOGOS)
       ========================================================================== */
    class MemeManager {
      constructor(game) {
        this.game = game;
        this.activeLeader = null; // 'lula' | 'bolsonaro' | null (empate)
        this.currentAudioSource = null;
        this.isPlaying = false;
        this.isWaitingNext = false;
        this.nextTimer = null;
        this.phraseInterval = null;
        this.fireworkTimer = 0;

        // Histórico para evitar repetição consecutiva de áudio e frase
        this.lastPlayedMeme = { lula: null, bolsonaro: null };
        this.lastPhrase = { lula: null, bolsonaro: null };

        // Playlists embaralhadas atuais e ponteiro de índice
        this.playlists = { lula: [], bolsonaro: [] };
        this.playlistIndices = { lula: 0, bolsonaro: 0 };

        // Frases grandes, chamativas e animadas para a tela
        this.phrases = {
          lula: [
            'É O LULA!',
            'LULAAAA!',
            'OLHA O LULA!',
            'LULA NA FRENTE!',
            'FAZ O L!',
            'O HOMEM DISPAROU!',
            'O BRASIL FELIZ DE NOVO!'
          ],
          bolsonaro: [
            'É O BOLSONARO!',
            'MITO!',
            'BOLSONARO NA FRENTE!',
            'OLHA O BOLSONARO!',
            'ACELERA CAPITÃO!',
            'IMBROXÁVEL NA PISTA!',
            'BRASIL ACIMA DE TUDO!'
          ]
        };

        this.bannerEl = document.getElementById('meme-banner');
        this.textEl = document.getElementById('meme-text');
      }

      /**
       * Gera uma nova ordem aleatória para os memes do personagem.
       * Garante que:
       * 1. A ordem seja verdadeiramente aleatória (Fisher-Yates).
       * 2. Não comece sempre pelo primeiro arquivo da pasta.
       * 3. O primeiro áudio dessa nova sequência NÃO seja igual ao último tocado
       *    por esse mesmo personagem na sua liderança anterior.
       */
      createShuffledSequence(runnerId) {
        const memes = [...(MEME_AUDIO_FILES[runnerId] || [])];
        if (memes.length <= 1) return memes;

        // Fisher-Yates shuffle
        for (let i = memes.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [memes[i], memes[j]] = [memes[j], memes[i]];
        }

        // Evita que o primeiro da nova sequência seja o mesmo que acabou de tocar
        const lastPlayed = this.lastPlayedMeme[runnerId];
        if (lastPlayed && memes[0] === lastPlayed) {
          const swapIdx = 1 + Math.floor(Math.random() * (memes.length - 1));
          [memes[0], memes[swapIdx]] = [memes[swapIdx], memes[0]];
        }

        return memes;
      }

      /**
       * Atualização contínua chamada a cada frame do loop principal
       */
      update(dt, detectedLeader, screenW, screenH) {
        const soundEnabled = this.game.audio && this.game.audio.enabled;

        // Se o som do jogo estiver mutado, interrompe e oculta
        if (!soundEnabled) {
          if (this.isPlaying || this.isWaitingNext) {
            this.stopCurrentMeme();
            this.hideText();
          }
          return;
        }

        // 1. No EMPATE (detectedLeader === null): pausar a reprodução dos memes
        if (!detectedLeader) {
          if (this.activeLeader !== null) {
            this.stopCurrentMeme();
            this.hideText();
            this.activeLeader = null;
          }
          return;
        }

        // 2. MUDANÇA DE LIDERANÇA:
        // "Quando a liderança mudar, interromper imediatamente os memes do antigo líder
        //  e começar a sequência do novo líder."
        // "Sempre que um personagem assumir a liderança, criar uma nova ordem aleatória para os memes dele."
        if (detectedLeader !== this.activeLeader) {
          this.stopCurrentMeme();
          this.activeLeader = detectedLeader;

          // Cria a nova ordem aleatória sem repetição do último áudio
          this.playlists[this.activeLeader] = this.createShuffledSequence(this.activeLeader);
          this.playlistIndices[this.activeLeader] = 0;

          // Inicia imediatamente o primeiro meme da nova sequência
          this.playCurrentMeme(screenW, screenH);
          return;
        }

        // 3. Se há líder mas não está tocando nem aguardando o intervalo de 2s
        if (this.activeLeader && !this.isPlaying && !this.isWaitingNext) {
          this.playCurrentMeme(screenW, screenH);
        }

        // 4. Fogos de artifício ocasionais durante a reprodução do meme
        if (this.isPlaying && this.activeLeader) {
          this.fireworkTimer -= dt;
          if (this.fireworkTimer <= 0) {
            this.game.effects.spawnMemeFirework(this.activeLeader, screenW, screenH);
            this.fireworkTimer = 0.55 + Math.random() * 0.80; // A cada 0.55s a 1.35s
          }
        }
      }

      /**
       * Toca o meme atual apontado pelo índice na playlist do líder
       */
      playCurrentMeme(screenW, screenH) {
        if (!this.activeLeader) return;
        const leaderId = this.activeLeader;
        const list = this.playlists[leaderId];
        if (!list || list.length === 0) return;

        // Percorre toda a lista embaralhada antes de embaralhá-la novamente
        if (this.playlistIndices[leaderId] >= list.length) {
          this.playlists[leaderId] = this.createShuffledSequence(leaderId);
          this.playlistIndices[leaderId] = 0;
        }

        const memePath = this.playlists[leaderId][this.playlistIndices[leaderId]];
        this.lastPlayedMeme[leaderId] = memePath;

        this.isPlaying = true;
        this.isWaitingNext = false;

        // Exibe o texto temático com animação pop
        this.showPhrase(leaderId);

        // Disparo comemorativo de fogos sincronizado com a entrada do áudio
        this.game.effects.spawnMemeFirework(leaderId, screenW, screenH);
        this.fireworkTimer = 0.65 + Math.random() * 0.60;

        // Executa a reprodução com Web Audio API ou fallback seguro
        this.startAudioPlayback(memePath, () => {
          this.onMemeFinished(screenW, screenH);
        });
      }

      /**
       * Callback executado assim que um meme termina de tocar
       */
      onMemeFinished(screenW, screenH) {
        this.isPlaying = false;
        this.currentAudioSource = null;

        // "Quando não houver meme tocando, remover ou ocultar o texto temporariamente."
        this.hideText();

        // "esperar 2 segundos após o término antes de iniciar o próximo"
        this.isWaitingNext = true;
        if (this.nextTimer) clearTimeout(this.nextTimer);

        this.nextTimer = setTimeout(() => {
          this.nextTimer = null;
          this.isWaitingNext = false;

          // Se continuar o mesmo líder e som ativo, avança para o próximo áudio
          if (this.activeLeader && this.game.audio && this.game.audio.enabled) {
            this.playlistIndices[this.activeLeader]++;
            this.playCurrentMeme(screenW, screenH);
          }
        }, 2000);
      }

      /**
       * Toca o áudio garantindo suporte Web Audio API e fallback HTMLAudio
       */
      startAudioPlayback(path, onEnded) {
        this.stopAudioPlaybackOnly();

        const audioCtx = this.game.audio.ctx;
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }

        const buffer = this.game.audio.mp3Buffers[path];

        // 1. Tenta reproduzir via buffer pré-decodificado (zero delay)
        if (buffer && audioCtx && audioCtx.state === 'running') {
          try {
            const source = audioCtx.createBufferSource();
            const gain = audioCtx.createGain();
            source.buffer = buffer;
            gain.gain.setValueAtTime(0.88, audioCtx.currentTime);
            source.connect(gain);
            gain.connect(audioCtx.destination);

            let endedFired = false;
            source.onended = () => {
              if (!endedFired && this.currentAudioSource === source) {
                endedFired = true;
                this.currentAudioSource = null;
                onEnded();
              }
            };

            source.start(0);
            this.currentAudioSource = source;
            return;
          } catch (e) {
            console.warn('Erro ao tocar buffer de meme:', e);
          }
        }

        // 2. Fallback resiliente com HTMLAudioElement
        try {
          const audio = new Audio(path);
          audio.volume = 0.88;
          let endedFired = false;

          audio.onended = () => {
            if (!endedFired && this.currentAudioSource === audio) {
              endedFired = true;
              this.currentAudioSource = null;
              onEnded();
            }
          };

          audio.onerror = () => {
            if (!endedFired && this.currentAudioSource === audio) {
              endedFired = true;
              this.currentAudioSource = null;
              onEnded();
            }
          };

          const playPromise = audio.play();
          if (playPromise && playPromise.catch) {
            playPromise.catch(() => {
              if (!endedFired && this.currentAudioSource === audio) {
                endedFired = true;
                this.currentAudioSource = null;
                onEnded();
              }
            });
          }
          this.currentAudioSource = audio;
        } catch (_) {
          onEnded();
        }
      }

      stopAudioPlaybackOnly() {
        if (this.currentAudioSource) {
          try {
            if (this.currentAudioSource.stop) {
              this.currentAudioSource.onended = null;
              this.currentAudioSource.stop();
              this.currentAudioSource.disconnect();
            } else if (this.currentAudioSource.pause) {
              this.currentAudioSource.onended = null;
              this.currentAudioSource.pause();
              this.currentAudioSource.currentTime = 0;
            }
          } catch (_) {}
          this.currentAudioSource = null;
        }
      }

      /**
       * Interrompe imediatamente qualquer meme tocando e cancela temporizadores
       */
      stopCurrentMeme() {
        this.stopAudioPlaybackOnly();
        if (this.nextTimer) {
          clearTimeout(this.nextTimer);
          this.nextTimer = null;
        }
        if (this.phraseInterval) {
          clearInterval(this.phraseInterval);
          this.phraseInterval = null;
        }
        this.isPlaying = false;
        this.isWaitingNext = false;
      }

      /**
       * Exibe frases chamativas com animação de entrada
       */
      showPhrase(runnerId) {
        if (!this.bannerEl || !this.textEl) return;
        const list = this.phrases[runnerId] || [];
        if (list.length === 0) return;

        let candidates = list.filter((p) => p !== this.lastPhrase[runnerId]);
        if (candidates.length === 0) candidates = list;
        const phrase = candidates[Math.floor(Math.random() * candidates.length)];
        this.lastPhrase[runnerId] = phrase;

        this.textEl.textContent = phrase;
        this.textEl.className = `meme-text-box ${runnerId === 'lula' ? 'meme-lula' : 'meme-bolsonaro'}`;

        // Reinicia a animação pop instantaneamente
        this.textEl.style.animation = 'none';
        void this.textEl.offsetWidth; // Força reflow no DOM
        this.textEl.style.animation = '';

        this.bannerEl.classList.remove('meme-hidden');
        this.bannerEl.classList.add('meme-visible');

        // Se o áudio durar mais de 3.2 segundos, alterna suavemente para outra frase divertida
        if (this.phraseInterval) clearInterval(this.phraseInterval);
        this.phraseInterval = setInterval(() => {
          if (this.isPlaying && this.activeLeader === runnerId) {
            this.showPhrase(runnerId);
          } else {
            clearInterval(this.phraseInterval);
            this.phraseInterval = null;
          }
        }, 3200);
      }

      /**
       * Oculta o banner de frase
       */
      hideText() {
        if (this.phraseInterval) {
          clearInterval(this.phraseInterval);
          this.phraseInterval = null;
        }
        if (this.bannerEl) {
          this.bannerEl.classList.remove('meme-visible');
          this.bannerEl.classList.add('meme-hidden');
        }
      }

      /**
       * Reinicia o estado dos memes (chamado no reset da corrida)
       */
      reset() {
        this.stopCurrentMeme();
        this.hideText();
        this.activeLeader = null;
        this.playlists = { lula: [], bolsonaro: [] };
        this.playlistIndices = { lula: 0, bolsonaro: 0 };
        this.lastPlayedMeme = { lula: null, bolsonaro: null };
        this.lastPhrase = { lula: null, bolsonaro: null };
      }
    }

    /* ==========================================================================
       6. ENGINE PRINCIPAL DO JOGO
       ========================================================================== */
    class ArcadeRaceGame {
      constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.audio = new RetroAudio();
        this.effects = new EffectsManager();
        this.memeManager = new MemeManager(this);

        // Dados do cenário processado
        this.stadiumTiles = null;
        this.bgScrollPx = 0;
        this.usingStartTile = true;
        this.elapsedTime = 0;
        this.lastFrameTime = performance.now();
        this.cameraShake = 0;

        // Estado do Super Impulso compartilhado
        this.superTargetMode = 'alternate'; // 'lula' | 'bolsonaro' | 'alternate'
        this.nextAlternateTarget = 'lula';
        this.superCooldown = 0;
        this.superCooldownMax = 2.4;

        // Instancia os dois corredores nas raias da pista
        // Bolsonaro na raia superior (Raia 2/3) e Lula na raia inferior (Raia 4/5)
        this.bolsonaro = new Runner({
          id: 'bolsonaro',
          name: 'BOLSONARO',
          primaryColor: '#148820',
          secondaryColor: '#ffdf00',
          tagBg: '#127a1d',
          tagBorder: '#ffdf00',
          tagText: '#ffdf00',
          laneYRatio: 0.775,
          scaleFactor: 0.96
        });

        this.lula = new Runner({
          id: 'lula',
          name: 'LULA',
          primaryColor: '#d91c24',
          secondaryColor: '#ffffff',
          tagBg: '#d91c24',
          tagBorder: '#ffffff',
          tagText: '#ffffff',
          laneYRatio: 0.875,
          scaleFactor: 1.0
        });

        this.runners = [this.bolsonaro, this.lula];
        this.currentLeaderId = 'lula';

        // Referências de UI
        this.ui = {
          leaderBadge: document.getElementById('leader-badge'),
          leadGapText: document.getElementById('lead-gap-text'),
          distLula: document.getElementById('dist-lula'),
          distBolsonaro: document.getElementById('dist-bolsonaro'),
          btnBoostLula: document.getElementById('btn-boost-lula'),
          btnBoostBolsonaro: document.getElementById('btn-boost-bolsonaro'),
          btnSuperBoost: document.getElementById('btn-super-boost'),
          statusLula: document.getElementById('status-lula'),
          statusBolsonaro: document.getElementById('status-bolsonaro'),
          statusSuper: document.getElementById('status-super'),
          barLula: document.getElementById('bar-lula'),
          barBolsonaro: document.getElementById('bar-bolsonaro'),
          barSuper: document.getElementById('bar-super'),
          btnSound: document.getElementById('btn-sound'),
          soundIcon: document.getElementById('sound-icon'),
          btnReset: document.getElementById('btn-reset'),
          targetChips: document.querySelectorAll('.target-chip'),
          giftRosa: document.getElementById('gift-btn-rosa'),
          giftCoracao: document.getElementById('gift-btn-coracao'),
          giftGg: document.getElementById('gift-btn-gg'),
          giftFogos: document.getElementById('gift-btn-fogos')
        };

        this.handleResize();
        window.addEventListener('resize', () => this.handleResize());
        this.bindControls();
      }

      handleResize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = Math.floor(this.width * dpr);
        this.canvas.height = Math.floor(this.height * dpr);
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.ctx.imageSmoothingEnabled = false;
      }

      async loadAssets() {
        const tryLoadSingleUrl = (url) =>
          new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error(`Falha ao abrir: ${url}`));
            img.src = url;
          });

        // Tenta todas as variações de caminho/codificação e usa o fallback Pixel Art se bloqueado no preview
        const loadSafe = async (fileName, fallbackFactory) => {
          const rawName = fileName.replace(/^img\//, '');
          const candidates = [
            fileName,
            encodeURI(fileName),
            `./${fileName}`,
            `./${encodeURI(fileName)}`,
            rawName,
            encodeURI(rawName),
            `./${rawName}`,
            `img/${rawName}`,
            `./img/${rawName}`,
            `./img/${encodeURI(rawName)}`,
            fileName.normalize('NFC'),
            fileName.normalize('NFD'),
            encodeURI(fileName.normalize('NFD'))
          ];

          for (const candidate of candidates) {
            try {
              return await tryLoadSingleUrl(candidate);
            } catch (_) {
              // Tenta a próxima variação de URL
            }
          }

          return fallbackFactory();
        };

        const [lulaSource, bolsonaroSource, stadiumSource] = await Promise.all([
          loadSafe(ASSET_PATHS.lula, () => AssetProcessor.createFallbackCharacterCanvas('lula')),
          loadSafe(ASSET_PATHS.bolsonaro, () => AssetProcessor.createFallbackCharacterCanvas('bolsonaro')),
          loadSafe(ASSET_PATHS.stadium, () => AssetProcessor.createFallbackStadiumCanvas())
        ]);

        this.lula.spriteData = AssetProcessor.processCharacterSprite(lulaSource);
        this.bolsonaro.spriteData = AssetProcessor.processCharacterSprite(bolsonaroSource);
        this.stadiumTiles = AssetProcessor.createSeamlessStadiumTiles(stadiumSource);

        // Pré-carrega os áudios de ultrapassagem da pasta mp3
        const overtakeLoads = [
          this.audio.loadAudioBuffer('audio13', ASSET_PATHS.audio13),
          this.audio.loadAudioBuffer('audio22', ASSET_PATHS.audio22)
        ];

        // Pré-carrega todos os áudios de memes para GitHub Pages
        const memeLoads = [
          ...MEME_AUDIO_FILES.lula,
          ...MEME_AUDIO_FILES.bolsonaro
        ].map((path) => this.audio.loadAudioBuffer(path, path));

        await Promise.all([...overtakeLoads, ...memeLoads]);
      }

      bindControls() {
        // Garante que o contexto de áudio seja ativado na primeira interação do usuário
        const unlockAudioOnFirstInteraction = () => {
          this.audio.init();
          window.removeEventListener('pointerdown', unlockAudioOnFirstInteraction);
          window.removeEventListener('keydown', unlockAudioOnFirstInteraction);
        };
        window.addEventListener('pointerdown', unlockAudioOnFirstInteraction, { once: true });
        window.addEventListener('keydown', unlockAudioOnFirstInteraction, { once: true });

        // Função utilitária para resposta imediata tanto em toque quanto em clique
        const bindFastAction = (el, handler) => {
          el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handler();
          });
        };

        // Botão 1: Impulso Lula
        bindFastAction(this.ui.btnBoostLula, () => this.triggerNormalBoost(this.lula));

        // Botão 2: Impulso Bolsonaro
        bindFastAction(this.ui.btnBoostBolsonaro, () => this.triggerNormalBoost(this.bolsonaro));

        // Botão 3: Super Impulso
        bindFastAction(this.ui.btnSuperBoost, () => this.triggerSuperBoost());

        // Seletor de Alvo do Super Impulso
        this.ui.targetChips.forEach((chip) => {
          bindFastAction(chip, () => {
            const target = chip.getAttribute('data-target');
            this.setSuperTargetMode(target);
            this.audio.playBeep(520, 0.05, 'square');
          });
        });

        // Som e Reiniciar
        bindFastAction(this.ui.btnSound, () => {
          const on = this.audio.toggle();
          this.ui.soundIcon.textContent = on ? '🔊' : '🔇';
          if (!on) {
            this.memeManager.stopCurrentMeme();
            this.memeManager.hideText();
          }
        });

        bindFastAction(this.ui.btnReset, () => {
          this.resetRace();
          this.audio.playBeep(440, 0.12, 'triangle');
        });

        // Atalhos de Teclado Arcade (1, 2, 3, Espaço)
        window.addEventListener('keydown', (e) => {
          if (e.repeat) return;
          if (e.key === '1' || e.key.toLowerCase() === 'a') {
            this.triggerNormalBoost(this.lula);
          } else if (e.key === '2' || e.key.toLowerCase() === 'l') {
            this.triggerNormalBoost(this.bolsonaro);
          } else if (e.key === '3' || e.key === ' ') {
            e.preventDefault();
            this.triggerSuperBoost();
          }
        });

        // Controles de Presentes TikTok (Exclusivos para Mobile)
        const bindGiftTap = (btnEl, action) => {
          if (!btnEl) return;
          bindFastAction(btnEl, () => {
            action();
            btnEl.classList.remove('is-gift-tapped');
            void btnEl.offsetWidth; // Força reflow para reiniciar animação visual de toque
            btnEl.classList.add('is-gift-tapped');
            setTimeout(() => btnEl.classList.remove('is-gift-tapped'), 160);
          });
        };

        // Lado esquerdo — Bolsonaro: Rosinha (normal) e Mãozinha de coração (super)
        bindGiftTap(this.ui.giftRosa, () => this.triggerNormalBoost(this.bolsonaro));
        bindGiftTap(this.ui.giftCoracao, () => this.triggerSuperBoost(this.bolsonaro));

        // Lado direito — Lula: GG (normal) e Fogos de artifício (super)
        bindGiftTap(this.ui.giftGg, () => this.triggerNormalBoost(this.lula));
        bindGiftTap(this.ui.giftFogos, () => this.triggerSuperBoost(this.lula));
      }

      setSuperTargetMode(mode) {
        this.superTargetMode = mode;
        this.ui.targetChips.forEach((chip) => {
          chip.className = 'target-chip';
          const t = chip.getAttribute('data-target');
          if (t === mode) {
            if (mode === 'lula') chip.classList.add('active-lula');
            else if (mode === 'bolsonaro') chip.classList.add('active-bolsonaro');
            else chip.classList.add('active-auto');
          }
        });
        this.updateUI();
      }

      getEffectiveSuperRunner() {
        if (this.superTargetMode === 'lula') return this.lula;
        if (this.superTargetMode === 'bolsonaro') return this.bolsonaro;
        return this.nextAlternateTarget === 'lula' ? this.lula : this.bolsonaro;
      }

      triggerNormalBoost(runner) {
        if (runner.activateNormalBoost()) {
          this.audio.playBoost(false);
          this.effects.spawnBoostBurst(runner.screenX, runner.screenY, false, runner.primaryColor);
          this.effects.spawnBanner(
            `IMPULSO ${runner.name}!`,
            'ACELERAÇÃO ATIVADA!',
            runner.primaryColor,
            '#ffdf00'
          );
          this.cameraShake = Math.max(this.cameraShake, 0.18);
        } else {
          this.audio.playBeep(160, 0.06, 'sawtooth', 0.05);
        }
      }

      triggerSuperBoost(forcedRunner = null) {
        const anySuperActive = this.lula.superTimer > 0 || this.bolsonaro.superTimer > 0;
        if (anySuperActive || this.superCooldown > 0) {
          this.audio.playBeep(150, 0.07, 'sawtooth', 0.05);
          return;
        }

        const chosenRunner = forcedRunner || this.getEffectiveSuperRunner();
        chosenRunner.activateSuperBoost();

        // Se estiver em modo alternado e o impulso não foi forçado diretamente por botão de presente
        if (this.superTargetMode === 'alternate' && !forcedRunner) {
          this.nextAlternateTarget = chosenRunner.id === 'lula' ? 'bolsonaro' : 'lula';
        }

        this.audio.playBoost(true);
        this.effects.spawnBoostBurst(chosenRunner.screenX, chosenRunner.screenY, true, chosenRunner.primaryColor);
        this.effects.spawnBanner(
          '⚡ SUPER IMPULSO! ⚡',
          `${chosenRunner.name} DISPAROU NA FRENTE!`,
          '#d90429',
          '#ffbe0b'
        );
        this.cameraShake = 0.42;
      }

      resetRace() {
        this.lula.reset();
        this.bolsonaro.reset();
        this.effects.reset();
        this.audio.stopCurrentOvertake();
        this.memeManager.reset();
        this.currentLeaderId = 'lula';
        this.bgScrollPx = 0;
        this.usingStartTile = true;
        this.superCooldown = 0;
        this.elapsedTime = 0;
        this.effects.spawnBanner('LARGADA!', 'CORRIDA INFINITA INICIADA', '#1e293b', '#ffdf00');
      }

      /**
       * Calcula a geometria vertical do estádio na tela para que a pista
       * ocupe a área principal e os botões inferiores não cubram os corredores.
       */
      getTrackViewport() {
        const isMobile = this.width < 640;
        const bottomReserved = isMobile ? Math.min(106, Math.max(86, this.height * 0.16)) : 110;
        const playableHeight = Math.max(220, this.height - bottomReserved);
        return {
          topY: 0,
          height: playableHeight,
          bottomY: playableHeight
        };
      }

      update(dt) {
        this.elapsedTime += dt;

        if (this.cameraShake > 0) {
          this.cameraShake = Math.max(0, this.cameraShake - dt);
        }

        // Gerencia recarga do Super Impulso quando termina
        const prevSuperActive = this.lula.superTimer > 0 || this.bolsonaro.superTimer > 0;

        const onRunnerStep = (runner) => {
          const dustColor = runner.superTimer > 0 ? '#ffbe0b' : '#e6ccb2';
          this.effects.spawnDust(runner.screenX - 10, runner.screenY - 4, dustColor, runner.isBoosted() ? 6 : 3);
          if (runner.id === 'lula') this.audio.playStep();
        };

        this.lula.update(dt, this.elapsedTime, onRunnerStep);
        this.bolsonaro.update(dt, this.elapsedTime, onRunnerStep);

        const nowSuperActive = this.lula.superTimer > 0 || this.bolsonaro.superTimer > 0;
        if (prevSuperActive && !nowSuperActive) {
          this.superCooldown = this.superCooldownMax;
        } else if (!nowSuperActive && this.superCooldown > 0) {
          this.superCooldown = Math.max(0, this.superCooldown - dt);
        }

        // Partículas contínuas enquanto o Super Impulso estiver ativo
        [this.lula, this.bolsonaro].forEach((r) => {
          if (r.superTimer > 0 && Math.random() < 0.55) {
            this.effects.spawnDust(r.screenX - 18, r.screenY - 25, '#ffbe0b', 2);
          }
        });

        // Velocidade da câmera acompanha a velocidade média ponderada pelo líder
        const maxSpeed = Math.max(this.lula.currentSpeed, this.bolsonaro.currentSpeed);
        const avgSpeed = (this.lula.currentSpeed + this.bolsonaro.currentSpeed) * 0.5;
        const cameraSpeed = avgSpeed * 0.65 + maxSpeed * 0.35;

        // Deslocamento horizontal contínuo do estádio (pixels por segundo)
        const pxPerMeter = Math.max(28, this.width * 0.036);
        this.bgScrollPx += cameraSpeed * pxPerMeter * dt;

        // Calcula posições horizontais (X) relativas na tela com escala elástica (Math.tanh)
        // garantindo que ambos SEMPRE permaneçam visíveis na tela mesmo com grande distância!
        const diffMeters = this.lula.distance - this.bolsonaro.distance; // + se Lula na frente
        const centerX = this.width * 0.46;
        const maxSpread = this.width * 0.29; // Permite ir de ~17% a ~75% da largura da tela
        const normalizedSpread = Math.tanh(diffMeters / 22); // Satura suavemente sem nunca sair da tela

        const targetLulaX = centerX + normalizedSpread * maxSpread;
        const targetBolsonaroX = centerX - normalizedSpread * maxSpread;

        // Interpolação suave de posição visual na tela
        if (this.lula.screenX === 0) {
          this.lula.screenX = targetLulaX;
          this.bolsonaro.screenX = targetBolsonaroX;
        } else {
          this.lula.screenX += (targetLulaX - this.lula.screenX) * Math.min(1, dt * 8);
          this.bolsonaro.screenX += (targetBolsonaroX - this.bolsonaro.screenX) * Math.min(1, dt * 8);
        }

        // Posição Y alinhada às raias da pista
        const vp = this.getTrackViewport();
        this.bolsonaro.screenY = vp.topY + vp.height * this.bolsonaro.laneYRatio;
        this.lula.screenY = vp.topY + vp.height * this.lula.laneYRatio;

        // Verifica Ultrapassagem e atualiza 1º / 2º imediatamente
        const newLeaderId = this.lula.distance >= this.bolsonaro.distance ? 'lula' : 'bolsonaro';
        if (newLeaderId !== this.currentLeaderId && Math.abs(diffMeters) > 0.35) {
          this.currentLeaderId = newLeaderId;
          const leader = newLeaderId === 'lula' ? this.lula : this.bolsonaro;
          this.audio.playOvertake(newLeaderId);
          this.effects.spawnFireworks(leader.screenX, leader.screenY, newLeaderId, this.width, vp.height);
          this.effects.spawnBanner(
            'ULTRAPASSAGEM!',
            `${leader.name} ASSUMIU O 1º LUGAR!`,
            leader.primaryColor,
            '#ffffff'
          );
        }

        if (this.currentLeaderId === 'lula') {
          this.lula.rank = 1;
          this.bolsonaro.rank = 2;
        } else {
          this.bolsonaro.rank = 1;
          this.lula.rank = 2;
        }

        // Intensidade de efeitos de velocidade
        let boostIntensity = 0;
        if (this.lula.superTimer > 0 || this.bolsonaro.superTimer > 0) boostIntensity = 1.6;
        else if (this.lula.boostTimer > 0 || this.bolsonaro.boostTimer > 0) boostIntensity = 0.9;

        this.effects.update(dt, this.width, vp.height, boostIntensity);
        this.updateUI();

        // Sistema Centralizado de Memes: Detecta a liderança pela posição real dos personagens
        // No empate (diferença <= 0.25m ou na largada), a reprodução é pausada
        let memeLeader = null;
        if (diffMeters > 0.25) {
          memeLeader = 'lula';
        } else if (diffMeters < -0.25) {
          memeLeader = 'bolsonaro';
        } else {
          memeLeader = null; // Empate técnico na pista
        }

        this.memeManager.update(dt, memeLeader, this.width, vp.height);
      }

      updateUI() {
        // Distâncias e Vantagem no HUD Superior
        const lulaM = Math.floor(this.lula.distance);
        const bolsonaroM = Math.floor(this.bolsonaro.distance);
        const gap = Math.abs(this.lula.distance - this.bolsonaro.distance).toFixed(1);

        this.ui.distLula.textContent = `${lulaM}m`;
        this.ui.distBolsonaro.textContent = `${bolsonaroM}m`;
        this.ui.leadGapText.textContent = `VANTAGEM: +${gap}m`;

        if (this.currentLeaderId === 'lula') {
          this.ui.leaderBadge.className = 'pixel-badge-lula';
          this.ui.leaderBadge.textContent = '1º LULA NA LIDERANÇA';
        } else {
          this.ui.leaderBadge.className = 'pixel-badge-bolsonaro';
          this.ui.leaderBadge.textContent = '1º BOLSONARO NA LIDERANÇA';
        }

        // Botão 1: Estado do Impulso Lula
        this.updateBoostButtonUI(
          this.lula,
          this.ui.btnBoostLula,
          this.ui.statusLula,
          this.ui.barLula,
          'PRONTO [TECLA 1]'
        );

        // Botão 2: Estado do Impulso Bolsonaro
        this.updateBoostButtonUI(
          this.bolsonaro,
          this.ui.btnBoostBolsonaro,
          this.ui.statusBolsonaro,
          this.ui.barBolsonaro,
          'PRONTO [TECLA 2]'
        );

        // Botão 3: Estado do Super Impulso
        const activeSuperRunner =
          this.lula.superTimer > 0 ? this.lula : this.bolsonaro.superTimer > 0 ? this.bolsonaro : null;

        if (activeSuperRunner) {
          this.ui.btnSuperBoost.classList.add('is-active');
          this.ui.btnSuperBoost.classList.remove('on-cooldown');
          const ratio = activeSuperRunner.superTimer / activeSuperRunner.superDuration;
          this.ui.barSuper.style.transform = `scaleX(${ratio})`;
          this.ui.statusSuper.textContent = `ATIVO: ${activeSuperRunner.name}! (${activeSuperRunner.superTimer.toFixed(1)}s)`;
        } else if (this.superCooldown > 0) {
          this.ui.btnSuperBoost.classList.remove('is-active');
          this.ui.btnSuperBoost.classList.add('on-cooldown');
          const ratio = 1 - this.superCooldown / this.superCooldownMax;
          this.ui.barSuper.style.transform = `scaleX(${ratio})`;
          this.ui.statusSuper.textContent = `RECARREGANDO (${this.superCooldown.toFixed(1)}s)`;
        } else {
          this.ui.btnSuperBoost.classList.remove('is-active', 'on-cooldown');
          this.ui.barSuper.style.transform = 'scaleX(1)';
          const nextRunner = this.getEffectiveSuperRunner();
          this.ui.statusSuper.textContent = `ALVO: ${nextRunner.name} [TECLA 3]`;
        }

        // Atualiza estado visual e feedback de cooldown dos presentes TikTok (Mobile)
        if (this.ui.giftRosa) {
          const rosaReady = this.bolsonaro.boostCooldown <= 0;
          this.ui.giftRosa.style.opacity = rosaReady ? '1' : '0.62';
          this.ui.giftRosa.style.filter = this.bolsonaro.boostTimer > 0 ? 'brightness(1.3) drop-shadow(0 0 6px #00e676)' : 'none';
        }
        if (this.ui.giftGg) {
          const ggReady = this.lula.boostCooldown <= 0;
          this.ui.giftGg.style.opacity = ggReady ? '1' : '0.62';
          this.ui.giftGg.style.filter = this.lula.boostTimer > 0 ? 'brightness(1.3) drop-shadow(0 0 6px #ff1744)' : 'none';
        }
        const superAvailable = !activeSuperRunner && this.superCooldown <= 0;
        if (this.ui.giftCoracao) {
          this.ui.giftCoracao.style.opacity = superAvailable ? '1' : '0.62';
          this.ui.giftCoracao.style.filter = this.bolsonaro.superTimer > 0 ? 'brightness(1.4) drop-shadow(0 0 8px #ffdf00)' : 'none';
        }
        if (this.ui.giftFogos) {
          this.ui.giftFogos.style.opacity = superAvailable ? '1' : '0.62';
          this.ui.giftFogos.style.filter = this.lula.superTimer > 0 ? 'brightness(1.4) drop-shadow(0 0 8px #ffdf00)' : 'none';
        }
      }

      updateBoostButtonUI(runner, btnEl, statusEl, barEl, readyText) {
        if (runner.boostTimer > 0) {
          btnEl.classList.add('is-active');
          btnEl.classList.remove('on-cooldown');
          const ratio = runner.boostTimer / runner.boostDuration;
          barEl.style.transform = `scaleX(${ratio})`;
          statusEl.textContent = `IMPULSO ATIVO! (${runner.boostTimer.toFixed(1)}s)`;
        } else if (runner.boostCooldown > 0) {
          btnEl.classList.remove('is-active');
          btnEl.classList.add('on-cooldown');
          const ratio = 1 - runner.boostCooldown / runner.boostCooldownMax;
          barEl.style.transform = `scaleX(${ratio})`;
          statusEl.textContent = `RECARGA (${runner.boostCooldown.toFixed(1)}s)`;
        } else {
          btnEl.classList.remove('is-active', 'on-cooldown');
          barEl.style.transform = 'scaleX(1)';
          statusEl.textContent = readyText;
        }
      }

      /* ========================================================================
         RENDERIZAÇÃO DO CENÁRIO, PERSONAGENS E IDENTIFICADORES FLUTUANTES
         ======================================================================== */
      render() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.width, this.height);

        ctx.save();
        // Tremor sutil de câmera no início de um Super Impulso
        if (this.cameraShake > 0) {
          const shakeMag = this.cameraShake * 7;
          ctx.translate(
            (Math.random() - 0.5) * shakeMag,
            (Math.random() - 0.5) * shakeMag
          );
        }

        // 1. Renderiza o Estádio e Pista Infinita
        this.drawInfiniteStadium(ctx);

        // 2. Linhas de velocidade atrás dos corredores
        this.effects.drawBehindRunners(ctx);

        // 3. Desenha os Corredores (ordenados por Y para perspectiva 2D correta)
        this.drawRunner(ctx, this.bolsonaro);
        this.drawRunner(ctx, this.lula);

        // 4. Desenha os Identificadores Flutuantes Acima da Cabeça de Cada Corredor
        this.drawFloatingIdentifier(ctx, this.bolsonaro);
        this.drawFloatingIdentifier(ctx, this.lula);

        // 5. Efeitos frontais (Partículas de poeira/energia e Banners Arcade)
        const vp = this.getTrackViewport();
        this.effects.drawFront(ctx, this.width, vp.height);

        ctx.restore();
      }

      drawInfiniteStadium(ctx) {
        if (!this.stadiumTiles) return;

        const vp = this.getTrackViewport();
        const tileH = vp.height;
        const tileW = Math.ceil(tileH * this.stadiumTiles.aspect);

        const totalScroll = Math.floor(this.bgScrollPx);
        const firstTileIndex = Math.floor(totalScroll / tileW);
        const offsetX = -(totalScroll % tileW);

        // Quantas cópias horizontais são necessárias para cobrir toda a largura da tela sem buracos
        const copiesNeeded = Math.ceil((this.width - offsetX) / tileW) + 1;

        for (let i = 0; i < copiesNeeded; i++) {
          const tileNumber = firstTileIndex + i;
          const drawX = Math.floor(offsetX + i * tileW);
          // O primeiro bloco (tileNumber === 0) exibe a linha de largada original;
          // todos os blocos seguintes usam o loopTile contínuo sem emendas!
          const sourceTile = tileNumber === 0 ? this.stadiumTiles.startTile : this.stadiumTiles.loopTile;

          // Sobrepõe 1px para evitar qualquer fresta de subpixel
          ctx.drawImage(sourceTile, drawX, vp.topY, tileW + 1, tileH);
        }

        // Preenche a faixa inferior (onde ficam os botões) com a extensão da grama da pista
        if (this.height > vp.bottomY) {
          const grassStripY = Math.floor(this.stadiumTiles.height * 0.93);
          const grassStripH = this.stadiumTiles.height - grassStripY;
          for (let i = 0; i < copiesNeeded; i++) {
            const drawX = Math.floor(offsetX + i * tileW);
            ctx.drawImage(
              this.stadiumTiles.loopTile,
              0, grassStripY, this.stadiumTiles.width, grassStripH,
              drawX, vp.bottomY - 2, tileW + 1, this.height - vp.bottomY + 4
            );
          }
          // Escurece levemente a área sob os botões para destacar a interface
          ctx.fillStyle = 'rgba(7, 11, 22, 0.48)';
          ctx.fillRect(0, vp.bottomY, this.width, this.height - vp.bottomY);
        }
      }

      getRunnerRenderMetrics(runner) {
        const vp = this.getTrackViewport();
        // Altura proporcional dos personagens na pista (grandes e bem reconhecíveis em mobile e desktop)
        const isMobile = this.width < 640;
        const targetRatio = isMobile ? (this.height > this.width ? 0.29 : 0.35) : 0.34;
        const minHeight = isMobile ? 95 : 120;
        const maxHeight = isMobile ? 210 : 255;
        const baseCharHeight = Math.max(minHeight, Math.min(maxHeight, vp.height * targetRatio)) * runner.scaleFactor;
        const sprite = runner.spriteData;
        const charWidth = baseCharHeight * sprite.aspect;

        // Salto vertical sutil da passada de corrida
        const strideBounce = Math.abs(Math.sin(runner.animPhase)) * (baseCharHeight * 0.045);

        // Inclinação sutil para frente ao acelerar
        const speedRatio = Math.max(0, (runner.currentSpeed - runner.baseSpeed) / 14);
        const forwardTilt = 0.03 + speedRatio * 0.09;

        const footX = runner.screenX;
        const footY = runner.screenY;

        return {
          charWidth,
          charHeight: baseCharHeight,
          strideBounce,
          forwardTilt,
          footX,
          footY,
          headTopY: footY - baseCharHeight - strideBounce
        };
      }

      drawRunner(ctx, runner) {
        const sprite = runner.spriteData;
        if (!sprite) return;

        const m = this.getRunnerRenderMetrics(runner);
        const framesInfo = sprite.frames;
        const frameCanvas = framesInfo.list[runner.getCurrentFrameIndex()];

        // Escala do frame com padding
        const scaleY = m.charHeight / sprite.height;
        const scaleX = m.charWidth / sprite.width;
        const drawW = framesInfo.frameWidth * scaleX;
        const drawH = framesInfo.frameHeight * scaleY;
        const padBottomPx = framesInfo.padY * scaleY;

        // 1. Sombra projetada na pista alinhada aos pés
        const shadowScale = 1 - (m.strideBounce / m.charHeight) * 1.4;
        const shadowW = m.charWidth * 0.62 * shadowScale;
        const shadowH = Math.max(6, m.charHeight * 0.075);

        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
        ctx.beginPath();
        ctx.ellipse(m.footX, m.footY - 3, shadowW * 0.5, shadowH * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 2. Desenha Rastros de Velocidade (Afterimages) quando estiver com Impulso
        for (const ghost of runner.afterimages) {
          const ghostFrame = framesInfo.list[ghost.frameIdx];
          ctx.save();
          ctx.globalAlpha = ghost.alpha;
          ctx.translate(ghost.x, ghost.y - m.strideBounce);
          ctx.rotate(m.forwardTilt);
          if (ghost.isSuper) {
            ctx.filter = 'sepia(1) saturate(6) hue-rotate(-15deg) brightness(1.2)';
          }
          ctx.drawImage(
            ghostFrame,
            -drawW * 0.5,
            -drawH + padBottomPx,
            drawW,
            drawH
          );
          ctx.restore();
        }

        // 3. Aura de Energia discreta se estiver com Impulso / Super Impulso
        if (runner.isBoosted()) {
          ctx.save();
          const isSuper = runner.superTimer > 0;
          ctx.globalAlpha = isSuper ? 0.35 : 0.22;
          ctx.fillStyle = isSuper ? '#ffbe0b' : runner.primaryColor;
          ctx.beginPath();
          ctx.ellipse(
            m.footX,
            m.footY - m.charHeight * 0.5 - m.strideBounce,
            m.charWidth * (isSuper ? 0.52 : 0.42),
            m.charHeight * 0.52,
            0,
            0,
            Math.PI * 2
          );
          ctx.fill();
          ctx.restore();
        }

        // 4. Desenha o Sprite Animado do Corredor
        ctx.save();
        ctx.translate(m.footX, m.footY - m.strideBounce);
        ctx.rotate(m.forwardTilt);
        ctx.drawImage(
          frameCanvas,
          -drawW * 0.5,
          -drawH + padBottomPx,
          drawW,
          drawH
        );
        ctx.restore();
      }

      /**
       * Desenha o identificador retrô flutuante acima da cabeça de cada personagem:
       * - Lula: fundo vermelho, texto branco/amarelo, seta indicadora e posição ("1º" / "2º").
       * - Bolsonaro: fundo verde/amarelo, texto amarelo/branco, seta indicadora e posição.
       * - Garante que nunca seja cortado nas bordas da tela.
       */
      drawFloatingIdentifier(ctx, runner) {
        const m = this.getRunnerRenderMetrics(runner);
        const isSmallMobile = this.width < 400;
        const isMobile = this.width < 580;
        const fontSize = isSmallMobile ? 7.5 : (isMobile ? 8.5 : 11);

        ctx.save();
        ctx.font = `bold ${fontSize}px "Press Start 2P", monospace`;

        const posLabel = `${runner.rank}º `;
        const fullLabel = `${posLabel}${runner.name}`;
        const textWidth = ctx.measureText(fullLabel).width;

        const padX = isSmallMobile ? 5 : (isMobile ? 7 : 11);
        const boxW = Math.ceil(textWidth + padX * 2);
        const boxH = isSmallMobile ? 18 : (isMobile ? 21 : 26);

        // Mantém sempre visível dentro das bordas horizontais e verticais da tela
        const clampedCenterX = Math.max(boxW * 0.5 + 6, Math.min(this.width - boxW * 0.5 - 6, m.footX + 4));
        const arrowTipY = Math.max(boxH + (isMobile ? 52 : 62), m.headTopY - (isMobile ? 4 : 6));
        const boxX = Math.round(clampedCenterX - boxW * 0.5);
        const boxY = Math.round(arrowTipY - boxH - (isMobile ? 5 : 7));

        // Sombra Sólida Arcade
        ctx.fillStyle = '#000000';
        ctx.fillRect(boxX + 2, boxY + 2, boxW, boxH);

        // Fundo Principal do Identificador
        ctx.fillStyle = runner.tagBg;
        ctx.fillRect(boxX, boxY, boxW, boxH);

        // Faixa lateral verde-amarela no identificador do Bolsonaro ou estrela no Lula
        if (runner.id === 'bolsonaro') {
          ctx.fillStyle = '#ffdf00';
          ctx.fillRect(boxX, boxY, 5, boxH);
        } else {
          ctx.fillStyle = '#ffdf00';
          ctx.fillRect(boxX, boxY, 5, boxH);
        }

        // Borda Pixelada Retrô
        ctx.lineWidth = 2;
        ctx.strokeStyle = runner.superTimer > 0 ? '#00f5d4' : runner.tagBorder;
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        // Barra fina de duração quando com Impulso Ativo
        if (runner.isBoosted()) {
          const ratio = runner.superTimer > 0
            ? runner.superTimer / runner.superDuration
            : runner.boostTimer / runner.boostDuration;
          ctx.fillStyle = runner.superTimer > 0 ? '#ffbe0b' : '#ffffff';
          ctx.fillRect(boxX + 2, boxY + boxH - 4, (boxW - 4) * ratio, 3);
        }

        // Texto da Posição ("1º" / "2º") + Nome do Personagem
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const textCenterY = boxY + Math.floor(boxH * 0.5) + 1;

        // Sombra do texto
        ctx.fillStyle = '#000000';
        ctx.fillText(fullLabel, clampedCenterX + 1, textCenterY + 1);

        // Cor do texto
        ctx.fillStyle = runner.rank === 1 ? '#ffdf00' : '#ffffff';
        ctx.fillText(fullLabel, clampedCenterX, textCenterY);

        // Seta/Marcador apontando diretamente para a cabeça do personagem
        const arrowX = Math.max(boxX + 10, Math.min(boxX + boxW - 10, m.footX + 6));
        ctx.beginPath();
        ctx.moveTo(arrowX - 6, boxY + boxH);
        ctx.lineTo(arrowX + 6, boxY + boxH);
        ctx.lineTo(arrowX, arrowTipY);
        ctx.closePath();
        ctx.fillStyle = runner.tagBg;
        ctx.fill();
        ctx.strokeStyle = runner.tagBorder;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();
      }

      start() {
        const loop = (now) => {
          // DeltaTime seguro em segundos (limitado a 50ms para evitar saltos ao trocar de aba)
          const dt = Math.min(0.05, Math.max(0.001, (now - this.lastFrameTime) / 1000));
          this.lastFrameTime = now;

          this.update(dt);
          this.render();

          requestAnimationFrame(loop);
        };

        this.lastFrameTime = performance.now();
        requestAnimationFrame(loop);
      }
    }

    /* ==========================================================================
       INICIALIZAÇÃO DO JOGO APÓS O CARREGAMENTO DOS ASSETS
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', async () => {
      const game = new ArcadeRaceGame();
      await game.loadAssets();
      game.start();
    });
  </script>
</body>
