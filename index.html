<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Corrida Arcade Infinita — Lula vs Bolsonaro</title>
  <!-- Tailwind CSS para estrutura responsiva -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fontes Pixel Art Retrô dos Anos 80/90 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-pixel: 'Press Start 2P', monospace;
      --font-arcade: 'VT323', monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0e17;
      font-family: var(--font-pixel);
      touch-action: manipulation;
    }

    /* Container Principal estilo Arcade */
    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #101828;
    }

    /* Canvas ocupa toda a tela em Pixel Art nítida */
    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      z-index: 1;
    }

    /* Efeito sutil de scanlines CRT arcade */
    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.14) 50%
      );
      background-size: 100% 4px;
    }

    /* HUD Superior Arcade */
    .arcade-hud-top {
      position: relative;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(8, 12, 24, 0.88) 0%, rgba(8, 12, 24, 0.55) 80%, rgba(8, 12, 24, 0) 100%);
      pointer-events: none;
    }

    .hud-box {
      pointer-events: auto;
      background: rgba(12, 18, 34, 0.88);
      border: 3px solid #ffffff;
      box-shadow: 0 4px 0 #000000, inset 0 0 0 2px #263554;
      padding: 6px 10px;
      border-radius: 6px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pixel-badge-lula {
      background: #d91c24;
      border: 2px solid #ffdf00;
      padding: 3px 7px;
      border-radius: 4px;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
      font-size: 10px;
    }

    .pixel-badge-bolsonaro {
      background: #148820;
      border: 2px solid #ffdf00;
      padding: 3px 7px;
      border-radius: 4px;
      color: #ffdf00;
      text-shadow: 2px 2px 0 #000;
      font-size: 10px;
    }

    .hud-icon-btn {
      pointer-events: auto;
      background: #1e293b;
      border: 3px solid #f8fafc;
      box-shadow: 0 4px 0 #000;
      color: #f8fafc;
      font-family: var(--font-pixel);
      font-size: 10px;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-shadow: 1px 1px 0 #000;
    }

    .hud-icon-btn:hover {
      background: #334155;
    }

    .hud-icon-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #000;
    }

    /* Barra Inferior de Controles de Impulso */
    .controls-dock {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 6px 12px calc(10px + env(safe-area-inset-bottom, 0px)) 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.25fr;
      gap: 10px;
      align-items: stretch;
      pointer-events: auto;
    }

    /* Estilo dos Botões Arcade Retrô */
    .arcade-btn {
      position: relative;
      border: 3px solid #ffffff;
      border-radius: 10px;
      padding: 10px 10px 14px 10px;
      font-family: var(--font-pixel);
      color: #ffffff;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.08s ease, filter 0.15s ease;
      text-shadow: 2px 2px 0 #000000;
      touch-action: manipulation;
    }

    .arcade-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36%;
      background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 100%);
      pointer-events: none;
    }

    .arcade-btn:active:not(.on-cooldown) {
      transform: translateY(4px) scale(0.98);
    }

    /* Botão 1: Impulso Lula (Vermelho) */
    .btn-lula {
      background: linear-gradient(180deg, #ef233c 0%, #b80c1f 100%);
      border-color: #ffe5ec;
      box-shadow: 0 6px 0 #59040e, 0 8px 16px rgba(0, 0, 0, 0.65);
    }
    .btn-lula:hover:not(.on-cooldown) {
      filter: brightness(1.1);
    }
    .btn-lula.is-active {
      border-color: #ffdf00;
      box-shadow: 0 0 18px #ff2a4b, 0 4px 0 #59040e;
      animation: pulse-glow-red 0.35s infinite alternate;
    }

    /* Botão 2: Impulso Bolsonaro (Verde/Amarelo) */
    .btn-bolsonaro {
      background: linear-gradient(180deg, #1ea82c 0%, #0e6b18 100%);
      border-color: #ffdf00;
      box-shadow: 0 6px 0 #063b0b, 0 8px 16px rgba(0, 0, 0, 0.65);
    }
    .btn-bolsonaro:hover:not(.on-cooldown) {
      filter: brightness(1.1);
    }
    .btn-bolsonaro.is-active {
      border-color: #ffffff;
      box-shadow: 0 0 18px #38ef7d, 0 4px 0 #063b0b;
      animation: pulse-glow-green 0.35s infinite alternate;
    }

    /* Botão 3: Super Impulso (Laranja / Ouro Energético) */
    .btn-super {
      background: linear-gradient(180deg, #ffbe0b 0%, #fb5607 55%, #d90429 100%);
      border-color: #fff3b0;
      box-shadow: 0 6px 0 #6a040f, 0 0 20px rgba(255, 190, 11, 0.55);
      animation: super-idle-pulse 1.5s infinite ease-in-out;
    }
    .btn-super:hover:not(.on-cooldown) {
      filter: brightness(1.12);
    }
    .btn-super.is-active {
      border-color: #ffffff;
      box-shadow: 0 0 28px #ffbe0b, 0 4px 0 #6a040f;
      animation: pulse-glow-super 0.25s infinite alternate;
    }

    /* Estado de recarga */
    .arcade-btn.on-cooldown {
      filter: saturate(0.55) brightness(0.82);
      cursor: not-allowed;
    }

    /* Barra de Progresso/Recarga na base de cada botão */
    .btn-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    .btn-progress-fill {
      height: 100%;
      width: 100%;
      background: #ffdf00;
      transform-origin: left center;
      transition: transform 0.05s linear;
    }

    /* Seletor Rápido do Alvo do Super Impulso */
    .super-target-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      pointer-events: auto;
    }

    .target-pill-group {
      background: rgba(11, 15, 28, 0.92);
      border: 2px solid #ffbe0b;
      box-shadow: 0 3px 0 #000;
      border-radius: 8px;
      padding: 3px 5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .target-chip {
      font-family: var(--font-pixel);
      font-size: 8px;
      padding: 4px 7px;
      border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer;
      color: #cbd5e1;
      background: #1e293b;
      transition: all 0.12s ease;
      text-shadow: 1px 1px 0 #000;
    }

    .target-chip.active-lula {
      background: #d91c24;
      color: #ffffff;
      border-color: #ffdf00;
    }

    .target-chip.active-bolsonaro {
      background: #148820;
      color: #ffdf00;
      border-color: #ffffff;
    }

    .target-chip.active-auto {
      background: #d97706;
      color: #ffffff;
      border-color: #fef08a;
    }

    @keyframes pulse-glow-red {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }
    @keyframes pulse-glow-green {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }
    @keyframes pulse-glow-super {
      from { transform: scale(1); filter: brightness(1.05); }
      to { transform: scale(1.03); filter: brightness(1.25); }
    }
    @keyframes super-idle-pulse {
      0%, 100% { box-shadow: 0 6px 0 #6a040f, 0 0 12px rgba(255, 190, 11, 0.45); }
      50% { box-shadow: 0 6px 0 #6a040f, 0 0 24px rgba(255, 190, 11, 0.85); }
    }

    /* Responsividade Mobile Detalhada (320px, 360px, 390px, 430px e telas maiores) */
    @media (max-width: 640px) {
      .arcade-hud-top {
        padding: calc(4px + env(safe-area-inset-top, 0px)) 6px 4px 6px;
        gap: 4px;
        justify-content: space-between;
      }
      .hud-box {
        padding: 4px 6px;
        gap: 5px;
        border-width: 2px;
        box-shadow: 0 2px 0 #000;
        flex: 1 1 auto;
        min-width: 0;
      }
      .hud-icon-btn {
        padding: 6px 8px;
        font-size: 8px;
        min-height: 38px;
        border-width: 2px;
        box-shadow: 0 2px 0 #000;
      }
      .controls-dock {
        padding: 4px 6px calc(6px + env(safe-area-inset-bottom, 0px)) 6px;
        gap: 4px;
      }
      .super-target-bar {
        justify-content: center;
        width: 100%;
      }
      .target-pill-group {
        padding: 2px 4px;
        gap: 3px;
        width: 100%;
        justify-content: space-around;
      }
      .target-chip {
        font-size: 7px;
        padding: 4px 5px;
        flex: 1 1 0;
        text-align: center;
        white-space: nowrap;
      }
      .buttons-grid {
        gap: 4px;
      }
      .arcade-btn {
        padding: 6px 2px 10px 2px;
        min-height: 48px;
        border-radius: 8px;
        border-width: 2px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.7);
      }
      .arcade-btn .btn-title {
        font-size: 8px;
        line-height: 1.1;
      }
      .arcade-btn .btn-status {
        font-size: 6.5px;
      }
    }

    /* Ajustes específicos para telas ultra-compactas (320px a 360px) */
    @media (max-width: 360px) {
      .arcade-hud-top {
        padding: calc(3px + env(safe-area-inset-top, 0px)) 4px 3px 4px;
      }
      .hud-box {
        padding: 3px 4px;
      }
      .hud-icon-btn {
        padding: 5px 6px;
        font-size: 8px;
      }
      .target-chip {
        font-size: 6.5px;
        padding: 3px 2px;
      }
      .buttons-grid {
        gap: 3px;
      }
      .arcade-btn {
        padding: 5px 1px 9px 1px;
        min-height: 46px;
      }
      .arcade-btn .btn-title {
        font-size: 7px;
      }
      .arcade-btn .btn-status {
        font-size: 6px;
      }
    }

    /* ==========================================================================
       BANNER DE MEMES: FRASES ANIMADAS NA TELA (ESTILO ARCADE RETRÔ)
       ========================================================================== */
    .meme-display-container {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 92%;
      max-width: 560px;
      transition: opacity 0.22s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .meme-display-container.meme-hidden {
      opacity: 0;
      transform: translateX(-50%) scale(0.65);
      visibility: hidden;
    }

    .meme-display-container.meme-visible {
      opacity: 1;
      visibility: visible;
    }

    .meme-text-box {
      font-family: var(--font-pixel);
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
      padding: 8px 18px;
      border-radius: 8px;
      letter-spacing: 0.6px;
      word-break: break-word;
      animation: memePop 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes memePop {
      0% {
        transform: scale(0.2) translateY(-12px);
        opacity: 0;
      }
      65% {
        transform: scale(1.14) translateY(2px);
      }
      85% {
        transform: scale(0.96) translateY(-1px);
      }
      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    .meme-lula {
      background: linear-gradient(135deg, #d91c24 0%, #99000a 100%);
      color: #ffffff;
      border: 3px solid #ffdf00;
      box-shadow: 0 5px 0 #5c000a, 0 0 20px rgba(217, 28, 36, 0.9);
      text-shadow: 2px 2px 0 #000, 0 0 8px #ffdf00;
    }

    .meme-bolsonaro {
      background: linear-gradient(135deg, #00b33c 0%, #005a20 100%);
      color: #ffdf00;
      border: 3px solid #ffffff;
      box-shadow: 0 5px 0 #003814, 0 0 20px rgba(0, 200, 83, 0.9);
      text-shadow: 2px 2px 0 #000, 0 0 8px #00e676;
    }

    @media (max-width: 640px) {
      .meme-display-container {
        top: 58px;
        max-width: 95%;
      }
      .meme-text-box {
        font-size: 9.5px;
        padding: 6px 12px;
        border-width: 2px;
        letter-spacing: 0.3px;
      }
    }

    @media (max-width: 360px) {
      .meme-display-container {
        top: 50px;
      }
      .meme-text-box {
        font-size: 8px;
        padding: 5px 9px;
      }
    }

    /* ==========================================================================
       BOTÕES DE PRESENTES DO TIKTOK (EXCLUSIVOS PARA DISPOSITIVOS MOBILE)
       ========================================================================== */
    .tiktok-gifts-column {
      display: none; /* Oculto por padrão em telas desktop */
      position: absolute;
      z-index: 25;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Somente visível em telas mobile ou estreitas (até 768px) */
    @media (max-width: 768px) {
      .tiktok-gifts-column {
        display: flex;
      }

      .tiktok-gifts-left {
        left: calc(6px + env(safe-area-inset-left, 0px));
        top: calc(54px + env(safe-area-inset-top, 0px));
      }

      .tiktok-gifts-right {
        right: calc(6px + env(safe-area-inset-right, 0px));
        top: calc(54px + env(safe-area-inset-top, 0px));
      }

      /* Ajusta o banner central de memes para ficar perfeitamente no centro entre as colunas */
      .meme-display-container {
        top: calc(54px + env(safe-area-inset-top, 0px));
        max-width: calc(100vw - 160px);
      }
    }

    .tiktok-gift-card {
      position: relative;
      background: rgba(10, 16, 30, 0.85);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 9px;
      padding: 5px 4px 6px 4px;
      width: 68px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 0 #000000, 0 3px 10px rgba(0, 0, 0, 0.6);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease, opacity 0.15s ease;
      touch-action: manipulation;
    }

    .tiktok-gift-card:active,
    .tiktok-gift-card.is-gift-tapped {
      transform: scale(0.90) translateY(2px);
      box-shadow: 0 1px 0 #000000;
      filter: brightness(1.25);
    }

    /* Borda e iluminação temática Bolsonaro */
    .gift-bolsonaro {
      border: 2px solid #00e676;
      box-shadow: 0 4px 0 #003d14, 0 0 12px rgba(0, 230, 118, 0.4);
    }

    /* Borda e iluminação temática Lula */
    .gift-lula {
      border: 2px solid #ff1744;
      box-shadow: 0 4px 0 #5c000a, 0 0 12px rgba(255, 23, 68, 0.4);
    }

    /* Wrapper do ícone proporcional e sem cortes */
    .gift-icon-wrapper {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: visible;
    }

    .gift-icon-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
      pointer-events: none;
    }

    /* Legendas nítidas de alto contraste para transmissão ao vivo */
    .gift-label {
      font-family: var(--font-pixel);
      font-size: 6.5px;
      line-height: 1.15;
      margin-top: 4px;
      padding: 2.5px 3px;
      border-radius: 4px;
      width: 100%;
      word-break: break-word;
      pointer-events: none;
      letter-spacing: 0.2px;
    }

    .gift-bolsonaro .gift-label {
      background: rgba(0, 48, 18, 0.9);
      border: 1px solid rgba(0, 230, 118, 0.65);
      color: #ffdf00;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }

    .gift-lula .gift-label {
      background: rgba(64, 4, 12, 0.9);
      border: 1px solid rgba(255, 23, 68, 0.65);
      color: #ffffff;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }

    /* Adaptação para celulares com tela compacta (320px a 375px) */
    @media (max-width: 375px) {
      .tiktok-gift-card {
        width: 54px;
        padding: 4px 2px 5px 2px;
        border-radius: 7px;
      }
      .gift-icon-wrapper {
        width: 38px;
        height: 38px;
      }
      .gift-label {
        font-size: 5.5px;
        padding: 2px 1px;
      }
      .meme-display-container {
        max-width: calc(100vw - 126px);
      }
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <!-- Canvas 2D Principal da Corrida -->
    <canvas id="game-canvas"></canvas>
    <div class="crt-overlay"></div>

    <!-- HUD Superior Retrô -->
    <header class="arcade-hud-top">
      <!-- Placar de Distância e Liderança -->
      <div class="hud-box">
        <div class="flex flex-col gap-1">
          <div class="flex items-center gap-2">
            <span id="leader-badge" class="pixel-badge-lula">1º LULA</span>
            <span id="lead-gap-text" class="text-[9px] sm:text-[11px] text-yellow-300 tracking-tight">VANTAGEM: 0.0m</span>
          </div>
          <div class="flex items-center gap-3 text-[8px] sm:text-[10px] text-slate-200">
            <span>🔴 LULA: <strong id="dist-lula" class="text-white">0m</strong></span>
            <span>🟢 BOLSONARO: <strong id="dist-bolsonaro" class="text-white">0m</strong></span>
          </div>
        </div>
      </div>

      <!-- Botões de Utilitários (Som e Reiniciar) -->
      <div class="flex items-center gap-2">
        <button id="btn-sound" class="hud-icon-btn" title="Ativar/Desativar Som Arcade">
          <span id="sound-icon">🔊</span>
          <span class="hidden sm:inline">SOM</span>
        </button>
        <button id="btn-reset" class="hud-icon-btn" title="Reiniciar Corrida">
          <span>↺</span>
          <span class="hidden sm:inline">REINICIAR</span>
        </button>
      </div>
    </header>

    <!-- Banner Central de Frases dos Memes (Posicionado no estádio sem cobrir corredores nem controles) -->
    <div id="meme-banner" class="meme-display-container meme-hidden" aria-live="polite">
      <div id="meme-text" class="meme-text-box"></div>
    </div>

    <!-- Controles de Presentes TikTok (Exclusivos para Mobile / Telas Estreitas) -->
    <!-- Coluna Esquerda: Bolsonaro -->
    <div id="tiktok-gifts-left" class="tiktok-gifts-column tiktok-gifts-left" aria-label="Presentes TikTok Bolsonaro">
      <!-- 1. Rosinha: Impulso Bolsonaro -->
      <button type="button" id="gift-btn-rosa" class="tiktok-gift-card gift-bolsonaro" aria-label="Impulso Bolsonaro">
        <div class="gift-icon-wrapper">
          <img src="img/Rosa vermelha brilhante em 3D.png" alt="Rosinha" class="gift-icon-img" draggable="false" />
        </div>
        <span class="gift-label">Impulso Bolsonaro</span>
      </button>

      <!-- 2. Mãozinha de Coração: SUPER Bolsonaro -->
      <button type="button" id="gift-btn-coracao" class="tiktok-gift-card gift-bolsonaro" aria-label="SUPER Bolsonaro">
        <div class="gift-icon-wrapper">
          <img src="img/Gestinho de coração em fundo transparente.png" alt="Mãozinha de coração" class="gift-icon-img" draggable="false" />
        </div>
        <span class="gift-label">SUPER Bolsonaro</span>
      </button>
    </div>

    <!-- Coluna Direita: Lula -->

  <script>
    /**
     * ============================================================================
     * CORRIDA ARCADE INFINITA: LULA VS BOLSONARO
     * Arquitetura modular:
     * 1. AudioEngine (Efeitos sonoros 8-bit via Web Audio API)
     * 2. AssetProcessor (Carregamento das 3 imagens originais, remoção de fundo
     *    branco via Flood Fill preservando detalhes internos e pista sem emendas)
     * 3. Runner (Física de corrida, estados de impulso, animação de braços/pernas)
     * 4. EffectsManager (Linhas de velocidade, poeira, partículas e banners retrô)
     * 5. GameEngine (Loop principal com deltaTime, câmera elástica e controles)
     * ============================================================================
     */

    const ASSET_PATHS = {
      lula: 'img/Corredor de Inverno em Pixel Art.png',
      bolsonaro: 'img/Político Brasileiro Correndo em Pixel Art.png',
      stadium: 'img/Estádio Pixelado_ Esporte É Vida.png',
      audio13: 'mp3/13.mp3',
      audio22: 'mp3/22.mp3'
    };

    /**
     * Lista explícita de áudios de memes para GitHub Pages
     * Organizados nas pastas 'mp3/meme lula/' e 'mp3/meme bolsonaro/'
     */
    const MEME_AUDIO_FILES = {
      lula: [
        'mp3/meme lula/ah-lula-meu-presidente.mp3',
        'mp3/meme lula/faz-o-l-luan-gameplays.mp3',
        'mp3/meme lula/lula-por-favor-me-ajuda.mp3'
      ],
      bolsonaro: [
        'mp3/meme bolsonaro/bolsonaro-e-norte-bolsonaro-e-nordeste.mp3',
        'mp3/meme bolsonaro/bolsonaro-risada.mp3',
        'mp3/meme bolsonaro/imbroxavel.mp3'
      ]
    };

    /* ==========================================================================
       1. SISTEMA DE ÁUDIO 8-BIT RETRÔ (SINTETIZADOR WEB AUDIO API)
       ========================================================================== */
    class RetroAudio {
      constructor() {
        this.enabled = true;
        this.ctx = null;
        this.mp3Buffers = {};
        this.currentOvertakeSource = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        if (this.enabled) {
          this.init();
          this.playBeep(660, 0.08, 'square');
        } else {
          this.stopCurrentOvertake();
        }
        return this.enabled;
      }

      playBeep(freq = 440, duration = 0.1, type = 'square', volume = 0.08) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(volume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      playBoost(isSuper = false) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const notes = isSuper
          ? [330, 440, 554, 659, 880, 1108, 1318]
          : [330, 440, 587, 784];

        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = isSuper ? 'sawtooth' : 'square';
          const startTime = now + idx * 0.045;
          const dur = isSuper ? 0.11 : 0.08;

          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(isSuper ? 0.09 : 0.07, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(startTime);
          osc.stop(startTime + dur);
        });
      }

      async loadAudioBuffer(key, url) {
        try {
          this.init();
          if (!this.ctx) return;
          const candidates = [
            url,
            encodeURI(url),
            `./${url}`,
            `./${encodeURI(url)}`
          ];
          for (const cand of candidates) {
            try {
              const res = await fetch(cand);
              if (!res.ok) continue;
              const arrayBuf = await res.arrayBuffer();
              const audioBuf = await this.ctx.decodeAudioData(arrayBuf);
              this.mp3Buffers[key] = audioBuf;
              return;
            } catch (_) {}
          }
        } catch (e) {
          console.warn(`Não foi possível pré-decodificar ${key}:`, e);
        }
      }

      stopCurrentOvertake() {
        if (this.currentOvertakeSource) {
          try {
            this.currentOvertakeSource.stop();
            this.currentOvertakeSource.disconnect();
          } catch (_) {}
          this.currentOvertakeSource = null;
        }
      }

      playOvertake(leaderId) {
        if (!this.enabled) return;
        this.init();

        // Interrompe imediatamente qualquer áudio de ultrapassagem anterior para não embolar
        this.stopCurrentOvertake();

        const bufferKey = leaderId === 'lula' ? 'audio13' : 'audio22';
        const buffer = this.mp3Buffers[bufferKey];

        if (buffer && this.ctx && this.ctx.state === 'running') {
          try {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = buffer;
            gain.gain.setValueAtTime(0.85, this.ctx.currentTime);
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.onended = () => {
              if (this.currentOvertakeSource === source) {
                this.currentOvertakeSource = null;
              }
            };
            source.start(0);
            this.currentOvertakeSource = source;
            return;
          } catch (e) {
            console.warn('Erro ao tocar buffer MP3:', e);
          }
        }

        // Fallback para áudio sintetizado retrô caso o MP3 não esteja decodificado
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = leaderId === 'lula' ? [523.25, 659.25, 783.99, 1046.5] : [440.0, 554.37, 659.25, 880.0];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          const t = now + idx * 0.055;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.09, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.12);
        });
      }

      playStep() {
        if (!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(95, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(42, this.ctx.currentTime + 0.035);
          gain.gain.setValueAtTime(0.025, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.035);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.035);
        } catch (e) {}
      }
    }

    /* ==========================================================================
       2. PROCESSAMENTO DE IMAGENS E PISTA INFINITA SEM EMENDAS
       ========================================================================== */
    class AssetProcessor {
      /**
       * Remove o fundo branco externo da imagem do personagem usando Flood Fill (BFS)
       * a partir das bordas da imagem. Isso preserva 100% os pixels brancos internos
       * (como a estrela branca do Lula, a barba e o colarinho branco do Bolsonaro),
       * além de recortar o bounding box exato até a sola do sapato.
       */
      static processCharacterSprite(img) {
        const w = img.naturalWidth || img.width;
        const h = img.naturalHeight || img.height;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = w;
        tempCanvas.height = h;
        const ctx = tempCanvas.getContext('2d', { willReadFrequently: true });
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0);

        let minX = 0, minY = 0, maxX = w - 1, maxY = h - 1;

        try {
          const imgData = ctx.getImageData(0, 0, w, h);
          const data = imgData.data;
          const visited = new Uint8Array(w * h);
          const queue = new Int32Array(w * h);
          let head = 0;
          let tail = 0;

          const isBgWhite = (idx) => {
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            const a = data[idx + 3];
            if (a < 20) return true;
            // Pixels claros do fundo externo
            return r > 224 && g > 224 && b > 224;
          };

          const pushSeed = (x, y) => {
            const pos = y * w + x;
            if (!visited[pos] && isBgWhite(pos * 4)) {
              visited[pos] = 1;
              queue[tail++] = pos;
            }
          };

          // Semeia todas as 4 bordas da imagem
          for (let x = 0; x < w; x++) {
            pushSeed(x, 0);
            pushSeed(x, h - 1);
          }
          for (let y = 0; y < h; y++) {
            pushSeed(0, y);
            pushSeed(w - 1, y);
          }

          // Flood Fill BFS para remover o fundo branco conectado ao exterior
          while (head < tail) {
            const curr = queue[head++];
            const cx = curr % w;
            const cy = (curr / w) | 0;
            const pIdx = curr * 4;

            // Torna transparente
            data[pIdx + 3] = 0;

            // Verifica os 4 vizinhos
            if (cx > 0) {
              const n = curr - 1;
              if (!visited[n] && isBgWhite(n * 4)) { visited[n] = 1; queue[tail++] = n; }
            }
            if (cx < w - 1) {
              const n = curr + 1;
              if (!visited[n] && isBgWhite(n * 4)) { visited[n] = 1; queue[tail++] = n; }
            }
            if (cy > 0) {
              const n = curr - w;
              if (!visited[n] && isBgWhite(n * 4)) { visited[n] = 1; queue[tail++] = n; }
            }
            if (cy < h - 1) {
              const n = curr + w;
              if (!visited[n] && isBgWhite(n * 4)) { visited[n] = 1; queue[tail++] = n; }
            }
          }

          // Remove halo esbranquiçado de 1px na borda imediata do contorno
          for (let y = 1; y < h - 1; y++) {
            for (let x = 1; x < w - 1; x++) {
              const pos = y * w + x;
              if (!visited[pos]) {
                const idx = pos * 4;
                const r = data[idx], g = data[idx + 1], b = data[idx + 2];
                if (r > 205 && g > 205 && b > 205) {
                  if (visited[pos - 1] || visited[pos + 1] || visited[pos - w] || visited[pos + w]) {
                    data[idx + 3] = 0;
                  }
                }
              }
            }
          }

          // Calcula o Bounding Box real dos pixels opacos do personagem
          minX = w; minY = h; maxX = 0; maxY = 0;
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const alpha = data[(y * w + x) * 4 + 3];
              if (alpha > 30) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }

          ctx.putImageData(imgData, 0, 0);
        } catch (err) {
          // Caso ocorra restrição de CORS local, mantém o recorte proporcional
          minX = Math.floor(w * 0.21);
          maxX = Math.floor(w * 0.76);
          minY = Math.floor(h * 0.03);
          maxY = Math.floor(h * 0.96);
        }

        if (maxX <= minX || maxY <= minY) {
          minX = 0; minY = 0; maxX = w - 1; maxY = h - 1;
        }

        const cropW = maxX - minX + 1;
        const cropH = maxY - minY + 1;

        const croppedCanvas = document.createElement('canvas');
        croppedCanvas.width = cropW;
        croppedCanvas.height = cropH;
        const croppedCtx = croppedCanvas.getContext('2d');
        croppedCtx.imageSmoothingEnabled = false;
        croppedCtx.drawImage(tempCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

        // Gera 10 frames de corrida pré-renderizados em Pixel Art para animação fluida
        const frames = AssetProcessor.buildRunningFrames(croppedCanvas);

        return {
          baseCanvas: croppedCanvas,
          frames,
          width: cropW,
          height: cropH,
          aspect: cropW / cropH
        };
      }

      /**
       * Constrói uma sequência de frames de corrida convincentes a partir do sprite
       * original, animando perna dianteira, perna traseira e braços/tronco sem
       * distorcer a cabeça ou perder a estética pixel art.
       */
      static buildRunningFrames(baseCanvas) {
        const w = baseCanvas.width;
        const h = baseCanvas.height;
        const totalFrames = 12;
        const frames = [];

        // Margem extra para acomodar o movimento das pernas e braços sem cortar
        const padX = Math.ceil(w * 0.12);
        const padY = Math.ceil(h * 0.06);
        const fw = w + padX * 2;
        const fh = h + padY * 2;

        // Divisões anatômicas proporcionais de ambos os sprites
        const headBottomY = Math.floor(h * 0.265);
        const torsoBottomY = Math.floor(h * 0.535);
        const legSplitX = Math.floor(w * 0.475); // Separação limpa entre perna de trás e da frente

        for (let i = 0; i < totalFrames; i++) {
          const phase = (i / totalFrames) * Math.PI * 2;
          // Ciclo da passada (-1 a +1)
          const stride = Math.sin(phase);

          const fCanvas = document.createElement('canvas');
          fCanvas.width = fw;
          fCanvas.height = fh;
          const fCtx = fCanvas.getContext('2d');
          fCtx.imageSmoothingEnabled = false;

          // 1. Perna Traseira (Esquerda do sprite) articulada no quadril
          const backHipX = padX + Math.floor(w * 0.43);
          const backHipY = padY + Math.floor(h * 0.54);
          // Oscila para frente quando stride < 0 e para trás quando stride > 0
          const backLegAngle = (-stride * 0.22) + 0.06;

          fCtx.save();
          fCtx.translate(backHipX, backHipY);
          fCtx.rotate(backLegAngle);
          fCtx.drawImage(
            baseCanvas,
            0, torsoBottomY - 8, legSplitX, h - (torsoBottomY - 8),
            -Math.floor(w * 0.43), -8, legSplitX, h - (torsoBottomY - 8)
          );
          fCtx.restore();

          // 2. Perna Dianteira (Direita do sprite) articulada no quadril em oposição
          const frontHipX = padX + Math.floor(w * 0.53);
          const frontHipY = padY + Math.floor(h * 0.54);
          const frontLegAngle = (stride * 0.20) - 0.05;

          fCtx.save();
          fCtx.translate(frontHipX, frontHipY);
          fCtx.rotate(frontLegAngle);
          fCtx.drawImage(
            baseCanvas,
            legSplitX, torsoBottomY - 8, w - legSplitX, h - (torsoBottomY - 8),
            legSplitX - Math.floor(w * 0.53), -8, w - legSplitX, h - (torsoBottomY - 8)
          );
          fCtx.restore();

          // 3. Tronco e Braços (Fatias horizontais com leve balanço de corrida dos punhos)
          const sliceStep = 3;
          for (let y = headBottomY; y < torsoBottomY + 8; y += sliceStep) {
            const sh = Math.min(sliceStep, torsoBottomY + 8 - y);
            const normY = (y - headBottomY) / (torsoBottomY - headBottomY);
            // Movimento sutil de impulsão dos braços e peito
            const armOffset = Math.round(stride * Math.sin(normY * Math.PI) * (w * 0.025));
            fCtx.drawImage(
              baseCanvas,
              0, y, w, sh,
              padX + armOffset, padY + y, w, sh
            );
          }

          // 4. Cabeça (Firme e nítida, com leve movimento natural acompanhando o pescoço)
          const headNodX = Math.round(stride * (w * 0.008));
          const headNodY = Math.round(Math.abs(stride) * (h * 0.008));
          fCtx.drawImage(
            baseCanvas,
            0, 0, w, headBottomY + 4,
            padX + headNodX, padY + headNodY, w, headBottomY + 4
          );

          frames.push(fCanvas);
        }

        return {
          list: frames,
          frameWidth: fw,
          frameHeight: fh,
          padX,
          padY
        };
      }

      /**
       * Cria um Tile Contínuo Perfeito a partir da imagem original do estádio.
       * - O Tile Inicial preserva a linha de largada original com os números 1 a 5.
       * - O Tile de Loop Infinito preenche a seção esquerda da pista com a textura
       *   contínua da direita da própria pista e suaviza a transição lateral da
       *   arquibancada para que nunca haja cortes secos ou linhas diagonais repetidas.
       */
      static createSeamlessStadiumTiles(stadiumImg) {
        const w = stadiumImg.naturalWidth || stadiumImg.width;
        const h = stadiumImg.naturalHeight || stadiumImg.height;

        // Tile 0: Estádio Original (usado na largada) + transição suave na borda direita
        const startTile = document.createElement('canvas');
        startTile.width = w;
        startTile.height = h;
        const sCtx = startTile.getContext('2d');
        sCtx.imageSmoothingEnabled = false;
        sCtx.drawImage(stadiumImg, 0, 0);

        // Tile 1: Estádio Contínuo sem a linha diagonal de largada para repetição infinita
        const loopTile = document.createElement('canvas');
        loopTile.width = w;
        loopTile.height = h;
        const lCtx = loopTile.getContext('2d');
        lCtx.imageSmoothingEnabled = false;
        lCtx.drawImage(stadiumImg, 0, 0);

        // Na imagem original, a grama e a pista começam em ~49.8% da altura
        // e a linha diagonal de largada ocupa os primeiros 36% da largura.
        // Substituímos os primeiros 38% da pista por fatias perfeitas da metade direita (x: 42% a 80%)
        // pois as linhas das raias são 100% horizontais!
        const trackStartY = Math.floor(h * 0.498);
        const trackHeight = h - trackStartY;
        const cleanSourceX = Math.floor(w * 0.42);
        const patchWidth = Math.floor(w * 0.40);

        lCtx.drawImage(
          stadiumImg,
          cleanSourceX, trackStartY, patchWidth, trackHeight,
          0, trackStartY, patchWidth, trackHeight
        );

        // Também uniformiza os últimos 4% da borda direita da pista para casar 100% com x=0
        const seamWidth = Math.floor(w * 0.05);
        for (let i = 0; i < seamWidth; i++) {
          const alpha = i / seamWidth;
          lCtx.save();
          lCtx.globalAlpha = alpha;
          lCtx.drawImage(
            loopTile,
            i, 0, 1, h,
            w - seamWidth + i, 0, 1, h
          );
          lCtx.restore();

          sCtx.save();
          sCtx.globalAlpha = alpha;
          sCtx.drawImage(
            loopTile,
            i, 0, 1, h,
            w - seamWidth + i, 0, 1, h
          );
          sCtx.restore();
        }

        return {
          startTile,
          loopTile,
          width: w,
          height: h,
          aspect: w / h
        };
      }

      /**
       * Reconstrói em Pixel Art fiel os sprites originais de Lula e Bolsonaro
       * caso o ambiente sandbox não permita acesso aos arquivos locais.
       */
      static createFallbackCharacterCanvas(type) {
        const gridW = 88;
        const gridH = 96;
        const scale = 4;

        const pxCanvas = document.createElement('canvas');
        pxCanvas.width = gridW;
        pxCanvas.height = gridH;
        const pCtx = pxCanvas.getContext('2d');
        pCtx.imageSmoothingEnabled = false;

        // Fundo branco externo (será processado pelo Flood Fill como na imagem original)
        pCtx.fillStyle = '#ffffff';
